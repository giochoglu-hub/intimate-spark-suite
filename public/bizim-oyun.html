<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#10090c" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Bizim Oyun</title>
<style>
:root{
  --bg:#10090c; --surface:#1b1015; --surface-2:#26151d;
  --wine:#7d2138; --wine-light:#a73752; --gold:#d9af61;
  --cream:#f5ead8; --muted:#bbaeb2; --danger:#c9505f; --success:#719b79;
  --radius:18px; --radius-lg:22px;
}
html[data-theme="gece"]{
  --bg:#08070f; --surface:#141327; --surface-2:#1e1a3a;
  --wine:#4b2a8a; --wine-light:#7a4dc7; --gold:#c3a6ff;
  --cream:#efeaff; --muted:#a9a2c9;
}
html[data-theme="orman"]{
  --bg:#0a0f0d; --surface:#12211a; --surface-2:#1a2f24;
  --wine:#2f6b4a; --wine-light:#4d9770; --gold:#d9c56a;
  --cream:#eef4e8; --muted:#a8b8ac;
}
.stop-fab{position:fixed;bottom:16px;right:16px;z-index:60;background:var(--danger);
  color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;
  box-shadow:0 10px 30px -10px rgba(201,80,95,.8);border:1px solid rgba(255,255,255,.15)}
.theme-chip{display:inline-block;width:22px;height:22px;border-radius:50%;
  border:2px solid transparent;margin-right:8px;vertical-align:middle;cursor:pointer}
.theme-chip.active{border-color:var(--gold)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior-y:contain}
body{min-height:100vh;min-height:100dvh;
  background:radial-gradient(1200px 700px at 50% -10%,#3a1420 0%,#10090c 55%,#0a0508 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--gold)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.01em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.app{max-width:520px;margin:0 auto;padding:20px 18px 100px;min-height:100vh;min-height:100dvh;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-size:14px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--surface-2)}
.iconbtn:hover{background:var(--surface-2)}
.card{background:linear-gradient(180deg,rgba(38,21,29,.85),rgba(27,16,21,.85));
  border:1px solid var(--surface-2);border-radius:var(--radius-lg);padding:20px;
  box-shadow:0 20px 60px -30px rgba(167,55,82,.6);backdrop-filter:blur(6px)}
.card + .card{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;
  border-radius:14px;background:var(--surface-2);color:var(--cream);font-weight:600;font-size:15px;
  border:1px solid transparent;min-height:48px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--wine-light),var(--wine));box-shadow:0 12px 30px -12px rgba(167,55,82,.9)}
.btn.gold{background:linear-gradient(135deg,#e6c079,#b98d3e);color:#2b1a08}
.btn.ghost{background:transparent;border-color:var(--surface-2);color:var(--muted)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.small{padding:10px 12px;font-size:13px;min-height:40px;width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 0;min-width:0}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--surface-2);
  color:var(--muted);font-size:12px;margin-right:6px;margin-top:6px}
.tag.gold{background:rgba(217,175,97,.15);color:var(--gold);border:1px solid rgba(217,175,97,.35)}
.tag.ai{background:rgba(167,55,82,.2);color:#f0b9c5;border:1px solid rgba(167,55,82,.5)}
.tag.custom{background:rgba(113,155,121,.15);color:#a9d1b1;border:1px solid rgba(113,155,121,.4)}
.muted{color:var(--muted)}
.center{text-align:center}
.hero-title{font-size:34px;margin-top:4px}
.hero-sub{color:var(--gold);font-style:italic;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--surface-2);
  text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.mod:hover{border-color:var(--gold)}
.mod .name{font-weight:700;font-size:15px}
.mod .desc{font-size:12px;color:var(--muted)}
.wheel-wrap{position:relative;width:260px;height:260px;margin:14px auto}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;
  transition:transform 4s cubic-bezier(.15,.85,.25,1);
  background:conic-gradient(from 0deg,#7d2138,#a73752,#d9af61,#7d2138,#a73752,#d9af61,#7d2138,#a73752);
  box-shadow:inset 0 0 0 6px #26151d,0 30px 60px -30px rgba(167,55,82,.7)}
.wheel::after{content:"";position:absolute;inset:24%;border-radius:50%;background:var(--surface);
  border:1px solid var(--surface-2);display:grid;place-items:center}
.wheel-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.wheel-center .lbl{font-size:12px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}
.wheel-center .val{font-size:15px;color:var(--cream);font-weight:700;margin-top:4px;max-width:120px;text-align:center}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
  border-top:18px solid var(--gold);z-index:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.overlay{position:fixed;inset:0;background:rgba(6,3,5,.85);display:grid;place-items:center;
  padding:20px;z-index:1000;backdrop-filter:blur(8px)}
.modal{background:var(--surface);border:1px solid var(--surface-2);border-radius:var(--radius-lg);
  padding:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.big{font-size:20px;font-weight:700}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-2);
  border:1px solid #3a2028;color:var(--cream);font:inherit;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.divider{height:1px;background:var(--surface-2);margin:16px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:11px;
  background:var(--surface-2);color:var(--muted)}
.hidden{display:none!important}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted);
  font-size:13px;border:1px solid transparent;cursor:pointer}
.pill.active{background:var(--wine);color:var(--cream);border-color:var(--wine-light)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--gold);
  border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface-2);color:var(--cream);padding:12px 18px;border-radius:12px;
  border:1px solid var(--gold);z-index:2000;font-size:14px;max-width:90vw;text-align:center}
.answers{display:flex;gap:8px}
.answers .btn{flex:1}
.consent-box{background:rgba(217,175,97,.08);border:1px solid rgba(217,175,97,.35);
  border-radius:14px;padding:14px;color:var(--cream);font-size:14px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--surface-2)}
.kv:last-child{border:0}
@media (prefers-reduced-motion: reduce){
  .wheel{transition:none}
}
html.reduced-motion .wheel{transition:none !important}
html.reduced-motion *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
</style>
</head>
<body>
<div class="app" id="app" aria-live="polite"></div>

<div id="toast-root"></div>

<script type="module">
"use strict";

/* ============================================================
 * 1. Constants & schemas
 * ============================================================ */
const SCHEMA_VERSION = 2;
const K = {
  meta:"bizimOyun.meta",
  settings:"bizimOyun.settings",
  pool:(m)=>`bizimOyun.pool.${m}`,
  seen:(m)=>`bizimOyun.seen.${m}`,
  custom:"bizimOyun.custom",
  disabled:"bizimOyun.disabled",
  favorites:"bizimOyun.favorites",
  sessions:"bizimOyun.sessions",
  activeSession:"bizimOyun.activeSession",
  daily:"bizimOyun.dailyQuestion",
  consent:"bizimOyun.consent",
  savedMemories:"bizimOyun.savedMemories",
};

const MODULES = {
  warmup:{name:"Isınma",desc:"Hafif, tanışma soruları",icon:"🌱"},
  flirt:{name:"Flört",desc:"Göz kırpan sorular",icon:"💋"},
  intimacy:{name:"Yakınlaşma",desc:"Duygusal ve fiziksel derinlik",icon:"🔥"},
  memories:{name:"Anılarımız",desc:"Ortak hikâyeler",icon:"📖"},
  party:{name:"Parti Oyunları",desc:"6 mini oyun",icon:"🎲"},
  okNok:{name:"OK mu NOK mu?",desc:"Durum çekin, birlikte OK ya da NOK deyin",icon:"🤔"},
  guessMe:{name:"Beni Tahmin Et",desc:"Birbirinizi ne kadar tanıyorsunuz?",icon:"💭"},
  sexDice:{name:"Sex Zarı",desc:"Yetişkin, rızaya dayalı",icon:"🎯"},
};

const LEVELS = ["warmup","flirt","intimacy","memories"];
const PARTY = ["truth","dare","whoAmI","taboo","charades","rapidFire","story","sameThought","secretMission","touchBingo"];
const PARTY_NAMES = {
  truth:"Doğruluk", dare:"Cesaret", whoAmI:"Ben Kimim?", taboo:"Tabu-lite",
  charades:"Sessiz Sinema", rapidFire:"Hızlı Ateş", story:"Hikâye Tamamla",
  sameThought:"Aynı Anda", secretMission:"Gizli Görev", touchBingo:"Dokunma Bingo"
};

/* ============================================================
 * 2. Utility functions
 * ============================================================ */
function hashStr(s){let h=5381;s=String(s);for(let i=0;i<s.length;i++)h=((h<<5)+h)+s.charCodeAt(i);return(h>>>0).toString(36)}
function cardId(title,prompt){return "c_"+hashStr((title||"")+"|"+(prompt||""))}
function today(){return new Date().toISOString().slice(0,10)}
function nowIso(){return new Date().toISOString()}
function uid(){return "u_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="style")e.setAttribute("style",attrs[k]);
    else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2),attrs[k]);
    else if(k==="html")e.innerHTML=attrs[k]; // only for trusted static strings
    else if(attrs[k]!=null&&attrs[k]!==false)e.setAttribute(k,attrs[k]);
  }
  for(const kid of kids){
    if(kid==null||kid===false)continue;
    if(Array.isArray(kid))kid.forEach(k=>k!=null&&e.append(k.nodeType?k:document.createTextNode(String(k))));
    else e.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  }
  return e;
}
function toast(msg,ms=2200){
  const t=el("div",{class:"toast"},msg);
  document.getElementById("toast-root").append(t);
  setTimeout(()=>t.remove(),ms);
}

/* ============================================================
 * 3. Storage helpers
 * ============================================================ */
const storage = {
  get(k,fallback){
    try{const raw=localStorage.getItem(k);if(raw==null)return fallback;
      const v=JSON.parse(raw);return v==null?fallback:v;
    }catch{return fallback}
  },
  set(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));return true}
    catch(e){toast("Depolama alanı dolu.");return false}
  },
  remove(k){try{localStorage.removeItem(k)}catch{}},
  getAll(){
    const out={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith("bizimOyun."))out[k]=storage.get(k,null);
    }
    return out;
  },
  reset(){
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith("bizimOyun."))keys.push(k);
    }
    keys.forEach(k=>localStorage.removeItem(k));
  }
};

/* ============================================================
 * 4. Migrations
 * ============================================================ */
const migrations = {
  1(){ return; },
  2(){
    // v2: introduce savedMemories. Preserve every existing key; only add if missing.
    try{
      if(localStorage.getItem(K.savedMemories) == null){
        localStorage.setItem(K.savedMemories, JSON.stringify([]));
      }
    }catch(e){}
  }
};
function runMigrations(){
  const meta = storage.get(K.meta,null);
  if(!meta){
    storage.set(K.meta,{schemaVersion:SCHEMA_VERSION,createdAt:nowIso(),updatedAt:nowIso()});
    return true;
  }
  let v = meta.schemaVersion||1;
  try{
    while(v<SCHEMA_VERSION){
      v++;
      if(migrations[v]) migrations[v]();
    }
    storage.set(K.meta,{...meta,schemaVersion:SCHEMA_VERSION,updatedAt:nowIso()});
    return true;
  }catch(e){
    return false;
  }
}

/* ============================================================
 * 5. Core card pools
 * ============================================================ */
function mk(title,prompt,{tags=[],category="genel",hardness=2,source="core",type="question",consentRequired=false}={}){
  return {id:cardId(title,prompt),title,prompt,tags,category,hardness,type,source,disabled:false,consentRequired:!!consentRequired};
}


const CORE = {
  warmup: [
    // ——— Günlük Hayat (daily-life) · 15
    mk("Sabah ilk on dakika","Sabah uyandığında ilk on dakikayı istediğin gibi tasarlayabilsen ne yapardın?",{tags:["ısınma","sabah","rutin"],category:"daily-life",hardness:1}),
    mk("Küçük gizli an","Günün en sevdiğin ama genelde kimseye anlatmadığın küçük anı hangisi?",{tags:["ısınma","gündelik"],category:"daily-life",hardness:1}),
    mk("Yalnızken garip","Evde kimse seni görmüyorken yaptığın en garip şey ne?",{tags:["ısınma","komik"],category:"daily-life",hardness:1}),
    mk("İlk uygulama","Sabah telefonunu açtığında refleksle girdiğin ilk uygulama hangisi ve seni ne çekiyor?",{tags:["ısınma","telefon"],category:"daily-life",hardness:1}),
    mk("Buzdolabı klasiği","Aç olmasan bile buzdolabını açınca aradığın şey ne oluyor?",{tags:["ısınma","yemek"],category:"daily-life",hardness:1}),
    mk("Uyku ritüeli","Uyumadan önce vazgeçemediğin küçük bir alışkanlığın var mı?",{tags:["ısınma","uyku"],category:"daily-life",hardness:1}),
    mk("Enerji artıran","Gün ortasında seni birden ayağa kaldıran, küçük ama işe yarayan bir şey ne?",{tags:["ısınma","enerji"],category:"daily-life",hardness:1}),
    mk("Ev sesi","Evde en çok özlediğin ses hangisi: mutfaktan gelen, dışarıdan gelen, yoksa sessizlik mi?",{tags:["ısınma","ev"],category:"daily-life",hardness:1}),
    mk("Sepete atmak","Markette hep sepete atıp sonra 'bunu neden aldım' dediğin bir şey var mı?",{tags:["ısınma","alışveriş"],category:"daily-life",hardness:1}),
    mk("Yeni haftalık","Yeni bir hafta başlarken en çok neyi iple çekiyorsun?",{tags:["ısınma","haftalık"],category:"daily-life",hardness:1}),
    mk("Yağmurlu ev","Dışarıda yağmur varken evdeki en sevdiğin köşen neresi olur?",{tags:["ısınma","ev"],category:"daily-life",hardness:1}),
    mk("Küçük lüks","Kendine sıkça izin verdiğin küçük bir lüks var mı?",{tags:["ısınma","zevk"],category:"daily-life",hardness:1}),
    mk("Yalnız hafta sonu","Bir hafta sonu tamamen evde tek başına kalsan sıkılmadan neler yapardın?",{tags:["ısınma","hafta sonu"],category:"daily-life",hardness:1}),
    mk("Yemek modu","Aç değilken bile 'canım şunu ister' dediğin bir yemek ne?",{tags:["ısınma","yemek"],category:"daily-life",hardness:1}),
    mk("Gece atıştırma","Gece geç saatte mutfağa girsen büyük ihtimalle önüne ne koyarsın?",{tags:["ısınma","gece"],category:"daily-life",hardness:1}),

    // ——— Hızlı Tercihler (quick-choice) · 15
    mk("Plansız mı planlı mı","Plansız bir gece gezmesi mi, haftalar öncesinden hazırlanmış mükemmel bir plan mı? Neden?",{tags:["ısınma","tercih"],category:"quick-choice",hardness:1}),
    mk("Deniz mi dağ mı","Bir hafta tatilde: deniz kenarı mı, dağ evi mi? Kısaca gerekçe.",{tags:["ısınma","tatil"],category:"quick-choice",hardness:1}),
    mk("Yazmak mı aramak mı","Uzun bir konuyu anlatırken yazmayı mı, aramayı mı seçersin? Neden?",{tags:["ısınma","iletişim"],category:"quick-choice",hardness:1}),
    mk("Sabahçı mı akşamcı mı","Kendini gerçekten hangi saatlerde daha canlı hissediyorsun?",{tags:["ısınma","enerji"],category:"quick-choice",hardness:1}),
    mk("Ev mi dışarı mı","Cuma akşamı seçenek çıksa: ev-kanepe mi, sokak-kalabalık mı? Neden?",{tags:["ısınma","cuma"],category:"quick-choice",hardness:1}),
    mk("Tatlı mı tuzlu mu","Yemek sonrası tatlı zorunlu mu, yoksa tuzlu bir şey mi iyi kapatır?",{tags:["ısınma","damak"],category:"quick-choice",hardness:1}),
    mk("Sürpriz mi bilgi mi","Hediye önceden söylenip beklenmesi mi, tamamen sürpriz olması mı? Neden?",{tags:["ısınma","hediye"],category:"quick-choice",hardness:1}),
    mk("Şehir mi doğa mı","Bir yıl yaşama şansın olsa yoğun bir şehir mi, sakin bir doğa mı?",{tags:["ısınma","yaşam"],category:"quick-choice",hardness:1}),
    mk("Fotoğraf mı an mı","Güzel bir sahneyi fotoğrafla ölümsüzleştirmek mi, sadece bakıp geçmek mi?",{tags:["ısınma","an"],category:"quick-choice",hardness:1}),
    mk("Uzun tatil, sık kaçış","Yılda tek uzun tatil mi, sık sık kısa kaçamaklar mı? Neden?",{tags:["ısınma","tatil"],category:"quick-choice",hardness:1}),
    mk("Yeni mi klasik mi","Restoranda yeni bir şey mi denersin, sevdiğin klasiği mi ısmarlarsın?",{tags:["ısınma","yemek"],category:"quick-choice",hardness:1}),
    mk("Kitap mı dizi mi","Aynı hikâye kitap ve dizi olarak varsa hangisiyle başlarsın? Neden?",{tags:["ısınma","hikaye"],category:"quick-choice",hardness:1}),
    mk("Kahvaltı mı brunch mı","Erken hafif kahvaltı mı, geç kalkıp uzun brunch mı?",{tags:["ısınma","sabah"],category:"quick-choice",hardness:1}),
    mk("Ev partisi mi bar mı","Kalabalık akşam için evde küçük bir parti mi, dışarıda bar mı?",{tags:["ısınma","gece"],category:"quick-choice",hardness:1}),
    mk("Duş mu küvet mi","Yorgun bir günün sonunda hızlı duş mu, uzun küvet mi?",{tags:["ısınma","dinlenme"],category:"quick-choice",hardness:1}),

    // ——— Komik ve Absürt (funny-absurd) · 15
    mk("Evcil hayvan ailesi","Bir hayvan seni evlat edinmek zorunda kalsaydı hangi hayvanın ailesine katılmak isterdin?",{tags:["ısınma","absürt"],category:"funny-absurd",hardness:1}),
    mk("Şarkı sözleriyle","Bir hafta boyunca yalnızca şarkı sözleriyle konuşmak zorunda kalsan hangi sanatçıyı seçerdin?",{tags:["ısınma","müzik"],category:"funny-absurd",hardness:1}),
    mk("Dedikoducu eşya","Evimizdeki bir eşya gece canlanıyor olsa hangisinin en fazla dedikodu bildiğini düşünürdün?",{tags:["ısınma","komik"],category:"funny-absurd",hardness:1}),
    mk("Zombi yeteneği","Zombi kıyametinde gereksiz gibi görünen ama seni kurtaracak bir yeteneğin olsa ne olurdu?",{tags:["ısınma","hayal"],category:"funny-absurd",hardness:1}),
    mk("Süpermarket kahramanı","Süpermarketten çıkan bir süper kahraman olsaydın gücün ne olurdu, adın ne?",{tags:["ısınma","komik"],category:"funny-absurd",hardness:1}),

function positionKey(text){
  if(!text) return "";
  const low = text.toLowerCase();
  const idx = low.indexOf(" — ");
  return (idx>0 ? low.slice(0,idx) : low).trim();

}
function compressImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 800;
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    if(changed) storage.set(K.pool(mod),stored);
    return stored;
  }
  storage.set(K.pool(mod),core);
  return core;
}

function disableCard(mod,id){const d=getDisabled();d[mod]=d[mod]||{};d[mod][id]=true;setDisabled(d)}

}
function resetSeen(mod){storage.set(K.seen(mod),[])}

function drawCard(mod,opts){
  const category = opts && opts.category;
  const maxHardness = opts && opts.maxHardness;
  const minHardness = opts && opts.minHardness;
  const excludeId = opts && opts.excludeId;
  let pool = loadPool(mod).filter(c=>c && !isDisabled(mod,c.id));
  if(category) pool = pool.filter(c=>c.category===category);
  if(typeof maxHardness === "number") pool = pool.filter(c=>(c.hardness||2)<=maxHardness);
  if(typeof minHardness === "number") pool = pool.filter(c=>(c.hardness||2)>=minHardness);
  if(excludeId) pool = pool.filter(c=>c.id!==excludeId);
  if(!pool.length) return null;
  const s = getSettings();
  if(s.favoritesOnly){
    const favs = getFavorites()[mod]||{};
    const favPool = pool.filter(c=>favs[c.id]);
    if(favPool.length) pool = favPool;
  }
  const seen = new Set(getSeen(mod));
  const unseenAi = pool.filter(c=>c.source==="ai" && !seen.has(c.id));
  if(unseenAi.length) return pick(unseenAi);
  const unseenCustom = pool.filter(c=>c.source==="custom" && !seen.has(c.id));
  if(unseenCustom.length) return pick(unseenCustom);
  const unseenCore = pool.filter(c=>c.source==="core" && !seen.has(c.id));
  if(unseenCore.length) return pick(unseenCore);
  // Fallback: allow already-seen cards for soften/replacement paths.
  if(opts && opts.allowSeen && pool.length) return pick(pool);
  return {__exhausted:true};
}

function countUnseen(mod,opts){
  const category = opts && opts.category;
  const maxHardness = opts && opts.maxHardness;
  let pool = loadPool(mod).filter(c=>c && !isDisabled(mod,c.id));
  if(category) pool = pool.filter(c=>c.category===category);
  if(typeof maxHardness === "number") pool = pool.filter(c=>(c.hardness||2)<=maxHardness);
  const seen = new Set(getSeen(mod));
  return pool.filter(c=>!seen.has(c.id)).length;
}

function softenCard(mod,currentCard,opts){
  // Find a lower-hardness card in the same category first, then fall back to module-wide.
  const currentH = currentCard && (currentCard.hardness||2);
  const targetMax = Math.max(1, (currentH||2) - 1);
  const category = opts && opts.category;
  const maxHardness = opts && opts.maxHardness;
  const cap = Math.min(targetMax, typeof maxHardness==="number"?maxHardness:5);
  let c = drawCard(mod,{category, maxHardness:cap, excludeId:currentCard?.id});
  if(!c || c.__exhausted) c = drawCard(mod,{maxHardness:cap, excludeId:currentCard?.id});
  if(!c || c.__exhausted) c = drawCard(mod,{maxHardness:cap, excludeId:currentCard?.id, allowSeen:true});
  return c;
}

function addCards(mod,newCards){
  const pool = loadPool(mod);
  const existing = new Set(pool.map(c=>c.id));
  let added=0;
  for(const c of newCards){
    const id = c.id || cardId(c.title,c.prompt);
    if(existing.has(id))continue;
    pool.push({...c,id,disabled:false});
    existing.add(id);
    added++;
  }
  savePool(mod,pool);
  return added;
}

function getDailyQuestion(){
  const d = storage.get(K.daily,null);
  const t = today();
  if(d && d.date===t){
    for(const m of LEVELS){
      const pool = loadPool(m);
      const found = pool.find(c=>c.id===d.id);
      if(found) return {card:found,mod:m};
    }
  }
  // pick a fresh one from any level, guarding flirt to only question-type & hardness<=2
  const all=[];
  for(const m of LEVELS){
    for(const c of loadPool(m)){
      if(isDisabled(m,c.id)) continue;
      if(m==="flirt"){
        const t = c.type||"question";
        if(t!=="question" && t!=="choice" && t!=="guess") continue;
        if((c.hardness||2) > 2) continue;
      }
      if(m==="intimacy"){
        const t = c.type||"question";
        if(t!=="question" && t!=="reflection") continue;
        if((c.hardness||2) > 2) continue;
        if(c.consentRequired) continue;
      }
      if(m==="memories"){
        const t = c.type||"question";
        if(t!=="question" && t!=="reflection" && t!=="memory") continue;
        if((c.hardness||2) > 2) continue;
      }
      all.push({card:c,mod:m});
    }
  }
  if(!all.length) return null;
  const pickIt = all[Math.floor(Math.random()*all.length)];
  storage.set(K.daily,{date:t,id:pickIt.card.id,mod:pickIt.mod});
  return pickIt;
}

function aiAvailable(){
  return location.protocol!=="file:" && (typeof navigator==="undefined" || navigator.onLine!==false);
}
async function generateCards(payload){
  if(!aiAvailable()) throw new Error("offline");
  const res = await fetch("/api/public/bizim-oyun-generate",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({ok:false,code:"INVALID_AI_RESPONSE",message:"Cevap işlenemedi."}));
  if(!res.ok || !data.ok){
    const map={
      RATE_LIMITED:"Çok sık istek. Biraz sonra dene.",
      PAYMENT_REQUIRED:"AI kredisi tükendi.",
      AI_UNAVAILABLE:"AI şu an kullanılamıyor.",
      INVALID_AI_RESPONSE:"AI cevabı işlenemedi.",
      INVALID_REQUEST:"İstek geçersiz.",
      INTERNAL_ERROR:"Beklenmedik bir hata."
    };
    throw new Error(map[data.code] || data.message || "Hata");
  }
  return data.cards;
}

  const WHEEL_SHORT = {

  );
  const wheelMods = Object.keys(MODULES);
  const sliceDeg = 360/wheelMods.length;
  (function buildWheelFace(){
    const R = 122, C = 130;
    const colors = ["var(--wine)","var(--wine-light)"];
    let svg = `<svg viewBox="0 0 260 260" width="100%" height="100%" style="display:block">`;
    wheelMods.forEach((k,i)=>{
      const a0 = (-90 + i*sliceDeg) * Math.PI/180;
      const a1 = (-90 + (i+1)*sliceDeg) * Math.PI/180;
      const x0 = (C + R*Math.cos(a0)).toFixed(2), y0 = (C + R*Math.sin(a0)).toFixed(2);
      const x1 = (C + R*Math.cos(a1)).toFixed(2), y1 = (C + R*Math.sin(a1)).toFixed(2);
      const largeArc = sliceDeg>180?1:0;
      svg += `<path d="M${C},${C} L${x0},${y0} A${R},${R} 0 ${largeArc} 1 ${x1},${y1} Z" style="fill:${colors[i%colors.length]}" stroke="var(--surface-2)" stroke-width="1.5"/>`;
      const am = (a0+a1)/2;
      const lx = (C + R*0.66*Math.cos(am)).toFixed(2), ly = (C + R*0.66*Math.sin(am)).toFixed(2);
      const labelDeg = (am*180/Math.PI + 90).toFixed(1);
      const label = MODULES[k].icon+" "+(WHEEL_SHORT[k]||MODULES[k].name);
      svg += `<text x="${lx}" y="${ly}" style="fill:var(--cream);font-size:11px;font-weight:700" text-anchor="middle" transform="rotate(${labelDeg} ${lx} ${ly})">${label}</text>`;
    });
    svg += `</svg>`;
    wheel.innerHTML = svg;
  })();
  wrap.append(pointer,wheel,center);
  wheelCard.append(wrap);
  const wheelActions = el("div",{style:"margin-top:12px;min-height:52px"});
  wheelCard.append(wheelActions);
  let spinning = false;
  let spinCount = 0;
  const spinBtn = btn("Çarkı Çevir","primary",()=>{

    document.getElementById("wheel-lbl").textContent = "";

    spinBtn.disabled = true; spinBtn.style.opacity = ".6";
    const idx = Math.floor(Math.random()*wheelMods.length);
    const chosen = wheelMods[idx];
    spinCount++;
    const rotations = 4 + (spinCount%3); // always adds fresh full turns so repeats still visibly spin
    // Land the pointer (fixed at the top, 0deg) on the middle of the chosen slice,
    // with a little jitter that still stays safely inside that slice.
    const jitter = (Math.random()-0.5) * (sliceDeg*0.5);
    const targetDeg = rotations*360 - (idx+0.5)*sliceDeg - jitter;
    const duration = settings.reducedMotion ? 500 : 3800;
    wheel.style.transition = `transform ${duration}ms cubic-bezier(.15,.85,.25,1)`;
    wheel.style.transform = `rotate(${targetDeg}deg)`;
    setTimeout(()=>{
      const m = MODULES[chosen];

      document.getElementById("wheel-val").textContent = m.icon+" "+m.name;
      wheelActions.innerHTML = "";

          spinning = false; spinBtn.disabled = false; spinBtn.style.opacity = "1";
          document.getElementById("wheel-lbl").textContent = "";
          document.getElementById("wheel-val").textContent = "🎡 Çarkı çevir";
          wheelActions.innerHTML = "";
        })
      );
      spinning = false; spinBtn.disabled = false; spinBtn.style.opacity = "1";
    },duration);
  });
  wheelCard.append(spinBtn);
  app.append(wheelCard);

  // modules grid
  const grid = el("div",{class:"grid"});

  app.append(el("div",{class:"card"},el("h3",null,"Modüller"),el("div",{style:"height:12px"}),grid));

  // active session pill
  if(sess){

      el("div",{style:"margin-top:6px"},`Toplam tur: ${sess.totalRounds} · Pas: ${sess.totalPasses}`),
      el("div",{style:"margin-top:12px"},btn("Gece özetine bak","gold",()=>navigate("#/summary")))
    ));

const K_INTIMACY_LEVEL = "bo.intimacyLevel.v1";

  {slug:"", label:"Tümü"},
  {slug:"our-firsts", label:"İlkler"},
  {slug:"first-impressions", label:"İlk İzlenimler"},
  {slug:"unforgettable-moments", label:"Unutulmayanlar"},
  {slug:"small-details", label:"Detaylar"},

];

  {slug:"light", label:"Hafif", minH:1, maxH:1},
  {slug:"emotional", label:"Duygusal", minH:1, maxH:2},
  {slug:"deep", label:"Derin", minH:2, maxH:3},

const K_MEMORIES_LEVEL = "bo.memoriesLevel.v1";

/* Saved memories helpers */
function getSavedMemories(){ return storage.get(K.savedMemories, []) || []; }
function addSavedMemory(cardId,title,note){
  const list = getSavedMemories();
  const s = getSettings();
  const entry = {
    id: uid(), cardId, title: String(title||"").slice(0,120),
    note: String(note||"").slice(0,500),
    createdAt: nowIso(),
    players: [s.player1||"Ozzy", s.player2||"Su"]
  };
  list.unshift(entry);
  storage.set(K.savedMemories, list.slice(0, 500));
  return entry;
}
function updateSavedMemory(id,patch){
  const list = getSavedMemories();
  const i = list.findIndex(x=>x.id===id);
  if(i<0) return false;
  if(patch.note!=null) list[i].note = String(patch.note).slice(0,500);
  if(patch.title!=null) list[i].title = String(patch.title).slice(0,120);
  storage.set(K.savedMemories, list); return true;
}
function deleteSavedMemory(id){
  const list = getSavedMemories().filter(x=>x.id!==id);
  storage.set(K.savedMemories, list);
}


function chipButton(label,active,onClick){
  return el("button",{
    class:"tag"+(active?" gold":""),
    style:"flex:0 0 auto;cursor:pointer;border:1px solid "+(active?"rgba(217,175,97,.5)":"rgba(255,255,255,.12)")+";background:"+(active?"rgba(217,175,97,.18)":"var(--surface-2)")+";color:"+(active?"var(--gold)":"inherit")+";font-size:13px;padding:6px 12px",
    onclick:onClick
  }, label);
}
function chipRow(items,isActive,onSelect){
  const row = el("div",{style:"display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0;scrollbar-width:none"});
  items.forEach(it=>row.append(chipButton(it.label, isActive(it), ()=>onSelect(it))));
  return row;
}

function renderLevel(app,mod){
  app.append(topbar(MODULES[mod].name));

  const isWarmup = mod === "warmup";
  const isFlirt = mod === "flirt";
  const isIntimacy = mod === "intimacy";
  const isMemories = mod === "memories";
  const hasLevels = isFlirt || isIntimacy || isMemories;
  const CATS = isWarmup ? WARMUP_CATEGORIES : isFlirt ? FLIRT_CATEGORIES : isIntimacy ? INTIMACY_CATEGORIES : isMemories ? MEMORIES_CATEGORIES : null;
  const FILTER_KEY = isWarmup ? K_WARMUP_FILTER : isFlirt ? K_FLIRT_FILTER : isIntimacy ? K_INTIMACY_FILTER : isMemories ? K_MEMORIES_FILTER : null;
  const LVL_SET = isFlirt ? FLIRT_LEVELS : isIntimacy ? INTIMACY_LEVELS : isMemories ? MEMORIES_LEVELS : null;
  const LVL_KEY = isFlirt ? K_FLIRT_LEVEL : isIntimacy ? K_INTIMACY_LEVEL : isMemories ? K_MEMORIES_LEVEL : null;
  const LVL_DEFAULT = isIntimacy ? "romantic" : isMemories ? "light" : "mixed";
  const LVL_LABEL = isFlirt ? "Flört seviyesi" : isIntimacy ? "Yakınlaşma seviyesi" : isMemories ? "Anı derinliği" : "";

  // Memories: mini-game shortcuts row
  if(isMemories){
    const bar = el("div",{class:"card",style:"padding:12px"});
    bar.append(el("div",{class:"muted",style:"font-size:12px;margin-bottom:8px"},"Mini oyunlar"));
    const row = el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"});
    row.append(btn("Zaman Çizgisi","ghost",()=>navigate("#/memories-timeline")));
    row.append(btn("Kim Daha İyi Hatırlıyor","ghost",()=>navigate("#/memories-compare")));
    row.append(btn("Anıyı Tamamla","ghost",()=>navigate("#/memories-story")));
    row.append(btn("Kaydettiğimiz Anılar","gold",()=>navigate("#/saved-memories")));
    bar.append(row);
    app.append(bar);
  }


  let filter = "";
  if(FILTER_KEY){ try { filter = localStorage.getItem(FILTER_KEY) || ""; } catch(e){ filter = ""; } }

  let curLevel = LVL_DEFAULT;
  if(hasLevels){
    try { curLevel = localStorage.getItem(LVL_KEY) || LVL_DEFAULT; } catch(e){}
  }
  const settings = getSettings();
  const globalCap = clamp(settings.hardness||3,1,5);
  function effectiveMaxH(){
    if(!hasLevels) return globalCap;
    const lvl = LVL_SET.find(l=>l.slug===curLevel) || LVL_SET[LVL_SET.length-1];
    return Math.min(lvl.maxH, globalCap);
  }
  function effectiveMinH(){
    if(!hasLevels) return undefined;
    const lvl = LVL_SET.find(l=>l.slug===curLevel) || LVL_SET[LVL_SET.length-1];
    return lvl.minH || undefined;
  }

  let levelBar = null, filterBar = null, countLine = null;
  const cardBox = el("div",{class:"card"});

  if(hasLevels){
    levelBar = el("div",{class:"card",style:"padding:10px 12px"});
    levelBar.append(el("div",{class:"muted",style:"font-size:12px;margin-bottom:6px"},LVL_LABEL));
    const row = chipRow(LVL_SET, (l)=>curLevel===l.slug, (l)=>{
      const boldSlugs = isFlirt ? ["bold"] : isIntimacy ? ["sensual","bold"] : [];
      const consentKey = isFlirt ? "flirtBold" : "intimacyBold";
      const wasBold = boldSlugs.includes(curLevel);
      const goingBold = boldSlugs.includes(l.slug);
      const apply = ()=>{
        curLevel = l.slug;
        try{ localStorage.setItem(LVL_KEY, curLevel) }catch(e){}
        drawAndShow();
      };
      if(goingBold && !wasBold){
        const consent = storage.get(K.consent,{});
        if(!consent[consentKey]){
          openModal((box,close)=>{
            box.append(el("h3",null,"Küçük hatırlatma"));
            const msg = isFlirt
              ? "Flörtün güzel tarafı karşılıklı olmasıdır. Her görev değiştirilebilir, yumuşatılabilir veya pas geçilebilir."
              : "Bu seviyede fiziksel yakınlık içeren kartlar gelebilir. Her kart değiştirilebilir, yumuşatılabilir veya pas geçilebilir; onay her kart için ayrıdır.";
            box.append(el("div",{class:"consent-box",style:"margin-top:12px"}, msg));
            sessionSet(mod,{consentCardsShown:(getSession().modules[mod]?.consentCardsShown||0)+1});
            box.append(el("div",{style:"margin-top:16px"},btn("Anladık, birlikte seçeriz","primary",()=>{
              consent[consentKey]=true;storage.set(K.consent,consent);close();apply();
            })));
          });
          return;
        }
      }
      apply();
    });
    levelBar.append(row);
    app.append(levelBar);
  }

  if(CATS){
    filterBar = el("div",{class:"card",style:"padding:10px 12px"});
    const row = chipRow(CATS, (cat)=>filter===cat.slug, (cat)=>{
      filter = cat.slug;
      try{ localStorage.setItem(FILTER_KEY, filter) }catch(e){}
      drawAndShow();
    });
    filterBar.append(row);
    countLine = el("div",{class:"muted",style:"margin-top:8px;font-size:12px"},"");
    filterBar.append(countLine);
    app.append(filterBar);
  }

  app.append(cardBox);

  function refreshBars(){
    if(levelBar){
      const chips = levelBar.querySelectorAll("button.tag");
      chips.forEach((chip,i)=>{
        const lvl = LVL_SET[i];
        const active = curLevel === lvl.slug;
        chip.className = "tag"+(active?" gold":"");
        chip.style.cssText = "flex:0 0 auto;cursor:pointer;border:1px solid "+(active?"rgba(217,175,97,.5)":"rgba(255,255,255,.12)")+";background:"+(active?"rgba(217,175,97,.18)":"var(--surface-2)")+";color:"+(active?"var(--gold)":"inherit")+";font-size:13px;padding:6px 12px";
      });
    }
    if(filterBar){
      const chips = filterBar.querySelectorAll("button.tag");
      chips.forEach((chip,i)=>{
        const cat = CATS[i];
        const active = filter === cat.slug;
        chip.className = "tag"+(active?" gold":"");
        chip.style.cssText = "flex:0 0 auto;cursor:pointer;border:1px solid "+(active?"rgba(217,175,97,.5)":"rgba(255,255,255,.12)")+";background:"+(active?"rgba(217,175,97,.18)":"var(--surface-2)")+";color:"+(active?"var(--gold)":"inherit")+";font-size:13px;padding:6px 12px";
      });
    }
    if(countLine){
      const opts = {};
      if(filter) opts.category = filter;
      if(hasLevels) opts.maxHardness = effectiveMaxH();
      const n = countUnseen(mod, opts);
      const label = filter ? (CATS.find(c=>c.slug===filter)?.label || "") : "Tümü";
      const suffix = hasLevels ? " · "+(LVL_SET.find(l=>l.slug===curLevel)?.label||"") : "";
      countLine.textContent = `Görülmemiş ${n} kart kaldı · ${label}${suffix}`;
    }
  }

  function buildExt(){
    return {
      filter, isFlirt, isIntimacy, hasSoften: hasLevels,
      effectiveMaxH:hasLevels?effectiveMaxH():undefined,
      onSoften: hasLevels ? (card)=>{
        const soft = softenCard(mod, card, {category:filter||undefined, maxHardness:effectiveMaxH()});
        if(!soft || soft.__exhausted){ toast("Daha yumuşak kart bulunamadı."); return; }
        bumpSession(mod,"soften");
        sessionSet(mod,{softenedCards:(getSession().modules[mod]?.softenedCards||0)+1});
        markSeen(mod,soft.id);
        renderCardUI(cardBox,mod,soft,drawAndShow, Object.assign(buildExt(),{
          onSoften:()=>{ toast("Zaten yumuşatıldı."); },
        }));
        refreshBars();
      } : undefined,
      onDone: hasLevels ? ()=>{
        bumpSession(mod,"done");
        sessionSet(mod,{completedDares:(getSession().modules[mod]?.completedDares||0)+1});
        drawAndShow();
      } : undefined,
      onReplace: hasLevels ? ()=>{ drawAndShow(); } : undefined,
    };
  }

  function drawAndShow(){
    refreshBars();
    cardBox.innerHTML="";
    const opts = {};
    if(filter) opts.category = filter;
    if(hasLevels) opts.maxHardness = effectiveMaxH();
    const c = drawCard(mod, opts);
    if(!c){cardBox.append(el("div",null,"Bu modülde henüz kart yok."));return}
    if(c.__exhausted){
      const msg = filter ? "Bu kategorinin uygun tüm kartlarını gördünüz." : "Bu modülün tüm kartlarını gördünüz.";
      cardBox.append(el("div",{class:"muted"},msg));
      cardBox.append(el("div",{style:"height:12px"}));
      if(aiAvailable()){
        cardBox.append(btn("Yeni sorular üret (AI)","primary",()=>requestAi(mod,cardBox,drawAndShow)));
      }
      cardBox.append(el("div",{style:"height:8px"}));
      cardBox.append(btn("Görülenleri sıfırla ve tekrar başla","ghost",()=>{
        resetSeen(mod);drawAndShow();
      }));
      if(filter){
        cardBox.append(el("div",{style:"height:8px"}));
        cardBox.append(btn("Karışık moda dön","ghost",()=>{
          filter="";try{localStorage.setItem(FILTER_KEY,"")}catch(e){}drawAndShow();
        }));
      }
      return;
    }
    bumpSession(mod,"round");
    markSeen(mod,c.id);
    renderCardUI(cardBox,mod,c,drawAndShow, buildExt());
    refreshBars();
  }
  drawAndShow();
}

function renderCardUI(box,mod,c,onNext,ext){
  ext = ext||{};
  const isTask = c && (c.type==="dare" || c.type==="moment");
  box.innerHTML="";
  const head = el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"},
    el("div",{class:"badge"},"#"+(c.category||"kart")),
    el("div",{style:"display:flex;gap:6px;flex-wrap:wrap"},
      c.type ? el("span",{class:"tag"},c.type) : null,
      el("span",{class:"tag gold"},"seviye "+(c.hardness||"?")),
      c.consentRequired ? el("span",{class:"tag",style:"background:rgba(217,175,97,.14);color:var(--gold);border-color:rgba(217,175,97,.35)"},"rıza gerekli") : null,
      c.source==="ai" ? el("span",{class:"tag ai"},"AI") : null,
      c.source==="custom" ? el("span",{class:"tag custom"},"özel") : null,
    )
  );
  box.append(head);
  box.append(el("h2",{style:"margin-top:10px"},c.title));
  box.append(el("div",{style:"margin-top:8px;font-size:16px"},c.prompt));
  box.append(tagList(c));

  // Two primary actions + a "…" overflow menu for everything else — this used
  // to stack up to 8 buttons at once (Yap/Yumuşat/Değiştir/Pas/Favori/Bir daha
  // gösterme/💾/AI üret on the memories module), which made every card feel
  // like a decision-fatigue wall late at night.
  const canDareUi = isTask && (ext.isFlirt || ext.isIntimacy || ext.hasSoften);
  const primaryRow = el("div",{class:"row",style:"margin-top:16px"});
  if(canDareUi){
    primaryRow.append(
      btn("Yap","primary",()=>{ (ext.onDone||onNext)(c); }),
      btn("Pas","ghost",()=>{ bumpSession(mod,"pass"); onNext(); })
    );
  } else {
    primaryRow.append(
      btn("Pas","ghost",()=>{bumpSession(mod,"pass");onNext()}),
      btn("Sonraki kart","primary",onNext)
    );
  }
  box.append(primaryRow);

  const moreBtn = btn("⋯ Daha fazla","ghost",()=>{
    openModal((mbox,close)=>{
      mbox.append(el("h3",null,"Bu kart için"));
      const list = el("div",{style:"margin-top:12px;display:flex;flex-direction:column;gap:8px"});
      mbox.append(list);
      if(canDareUi){
        list.append(btn("Yumuşat","gold",()=>{ close(); if(ext.onSoften) ext.onSoften(c); else onNext(); }));
        list.append(btn("Değiştir","ghost",()=>{ close(); if(ext.onReplace) ext.onReplace(c); else onNext(); }));
      }
      list.append(btn(isFav(mod,c.id)?"★ Favorilerden çıkar":"☆ Favorilere ekle","ghost",()=>{
        const on = toggleFav(mod,c.id);
        toast(on?"Favorilere eklendi":"Favoriden çıkarıldı");
        close();
      }));
      list.append(btn("Bir daha gösterme","danger",()=>{
        close(); disableCard(mod,c.id);toast("Bu kart artık gösterilmeyecek.");onNext();
      }));
      if(mod === "memories"){
        list.append(btn("💾 Bu anıyı kaydet","gold",()=>{ close(); openSaveMemoryModal(c); }));
      }
      if(aiAvailable()){
        list.append(btn("Yeni sorular üret (AI)","gold",()=>{ close(); requestAi(mod,box,onNext); }));
      } else {
        mbox.append(el("div",{class:"muted",style:"margin-top:10px;font-size:12px"},
          "AI ile yeni kart üretmek için oyunu çevrimiçi adresinden aç. Sabit ve özel kartlar çevrimdışı çalışır."));
      }
      list.append(btn("Kapat","ghost",close));
    });
  });
  box.append(el("div",{style:"margin-top:10px"},moreBtn));
}

      });

async function requestAi(mod,box,onNext){
  const settings = getSettings();
  const pool = loadPool(mod);
  const avoidTitles = pool.slice(-50).map(c=>c.title);
  const originalHtml = box.innerHTML;
  box.innerHTML="";
  box.append(el("div",{class:"center"},
    el("div",{class:"spinner"}),
    el("div",{class:"muted",style:"margin-top:12px"},"AI yeni kartlar üretiyor…")
  ));
  const moduleMap = { party:"truth" }; // safety; level modules use their own key
  const modKey = moduleMap[mod]||mod;
  try{
    const cards = await generateCards({
      module:modKey,
      level:LEVELS.includes(mod)?mod:undefined,
      count:5,
      hardness:clamp(settings.hardness||3,1,5),
      avoidTitles
    });
    const normalized = cards.map(c=>({
      title:c.title,prompt:c.prompt,tags:c.tags||[],
      category:c.category||"ai",hardness:c.hardness||3,
      type:c.type||"question",source:"ai"
    }));
    const added = addCards(mod,normalized);
    toast(`${added} yeni kart eklendi.`);
    if(onNext)onNext();
    else render();
  }catch(e){
    box.innerHTML=originalHtml;
    toast("AI hatası: "+e.message);
  }
}

/* ============================================================

 * ============================================================ */
route("/ok-nok",(app)=>{
  app.append(topbar("OK mu NOK mu?"));
  const OK_NOK_CATS = [
    ["all","Tümü"],
    ["messaging","Mesajlaşma"],
    ["social-media","Sosyal Medya"],
    ["trust-jealousy","Güven"],
    ["friends-nightlife","Arkadaşlar"],
    ["personal-space","Özel Alan"],
    ["romance-attention","Romantizm"],
    ["daily-life","Günlük"],
    ["money","Para"],
    ["travel-plans","Tatil"],
    ["communication","İletişim"],
    ["boundaries","Sınırlar"],
  ];
  // Each card now goes through a private hand-off for both players (turn 1,
  // then turn 2) before revealing whether they matched — previously there was
  // a single shared OK/NOK button, so there was never any per-person answer
  // to compare and "which topics we differ on" could never be computed.
  const state = { card:null, category:"all", phase:"handoff", turn:1, p1Choice:null, p2Choice:null };
  const settings = getSettings();
  const p1name = settings.player1 || "Oyuncu 1";
  const p2name = settings.player2 || "Oyuncu 2";

  // Filter bar
  const filterWrap = el("div",{style:"display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px;-webkit-overflow-scrolling:touch;margin-bottom:8px"});
  OK_NOK_CATS.forEach(([id,label])=>{
    const chip = el("button",{class:"btn ghost",style:"white-space:nowrap;padding:6px 12px;font-size:13px;flex:0 0 auto"},label);
    chip.addEventListener("click",()=>{state.category=id;refreshChips();nextCard()});
    chip._catId = id;
    filterWrap.append(chip);
  });
  function refreshChips(){
    [...filterWrap.children].forEach(c=>{
      c.className = "btn " + (c._catId===state.category ? "primary" : "ghost");
    });
  }
  refreshChips();
  app.append(filterWrap);

  const box = el("div",{class:"card"});
  app.append(box);
  const progress = el("div",{class:"muted center",style:"margin-top:10px;font-size:13px"});
  app.append(progress);

  function drawFiltered(){
    const opts = state.category==="all" ? {} : {category:state.category};
    return drawCard("okNok",opts);
  }
  function unseenCount(){
    return countUnseen("okNok", state.category==="all"?{}:{category:state.category});
  }
  function updateProgress(){
    progress.textContent = unseenCount()+" kart kaldı";
  }

  function nextCard(){
    const c = drawFiltered();
    state.card = c;
    state.phase = "handoff";
    state.turn = 1;
    state.p1Choice = null;
    state.p2Choice = null;
    render();
  }

  function finalizeRound(){
    // Increment everything on one session object and save once — calling
    // bumpSession() here as well would read its own separate copy of the
    // session and clobber whatever we write below (lost-update race).
    const s = getSession();
    s.modules.okNok = s.modules.okNok || {rounds:0,passes:0,agreeCount:0,disagreeCount:0,pairs:[]};
    const m = s.modules.okNok;
    m.pairs = m.pairs || [];
    const p1 = state.p1Choice, p2 = state.p2Choice;
    if(p1==="pass" || p2==="pass"){
      m.passes = (m.passes||0)+1; s.totalPasses = (s.totalPasses||0)+1;
    } else {
      m.rounds = (m.rounds||0)+1; s.totalRounds = (s.totalRounds||0)+1;
      if(p1===p2){ m.agreeCount = (m.agreeCount||0)+1; }
      else {
        m.disagreeCount = (m.disagreeCount||0)+1;
        m.pairs.push({prompt:state.card.prompt, category:state.card.category, p1, p2});
        if(m.pairs.length>40) m.pairs.shift();
      }
    }
    storage.set(K.activeSession,s);
    markSeen("okNok", state.card.id);
  }

  function answer(choice){
    if(!state.card || state.card.__exhausted || state.phase!=="answering") return;
    if(state.turn===1){
      state.p1Choice = choice;
      state.turn = 2;
      state.phase = "handoff";
    } else {
      state.p2Choice = choice;
      finalizeRound();
      state.phase = "reveal";
    }
    render();
  }

  function choiceLabel(c){
    return c==="ok" ? "OK 👍" : c==="nok" ? "NOK 👎" : "Pas";
  }

  function render(){
    box.innerHTML = "";
    updateProgress();
    if(!state.card){
      box.append(el("div",{class:"muted center"},"Başlamak için bir kategori seç ya da 'Tümü'nden çek."));
      box.append(el("div",{style:"height:12px"}));
      box.append(btn("Kart çek","primary",()=>nextCard()));
      return;
    }
    if(state.card.__exhausted){
      box.append(el("div",{class:"center"},"Bu kategoride tüm kartlar gösterildi."));
      box.append(el("div",{style:"height:10px"}));
      const row = el("div",{class:"row",style:"gap:8px;flex-wrap:wrap;justify-content:center"});
      row.append(btn("Sıfırla","ghost",()=>{resetSeen("okNok");nextCard()}));
      row.append(btn("Tümüne geç","primary",()=>{state.category="all";refreshChips();nextCard()}));
      box.append(row);
      return;
    }

    // Hand-off screen: keeps the current answer private until the other
    // player is holding the phone.
    if(state.phase==="handoff"){
      const who = state.turn===1 ? p1name : p2name;
      box.append(el("div",{class:"center",style:"padding:12px 0"},
        el("div",{style:"font-size:34px;margin-bottom:10px"},"📱"),
        el("div",{class:"big"},"Telefonu "+who+"'a ver"),
        el("div",{class:"muted",style:"margin-top:8px"},state.turn===1
          ? "Diğer kişi görmeden hazır olduğunda dokun."
          : "İlk cevap kaydedildi — şimdi sıra sende."),
      ));
      box.append(el("div",{style:"height:16px"}));
      box.append(btn("Soruyu göster","primary",()=>{ state.phase="answering"; render(); }));
      return;
    }

    // Reveal screen: shows both private answers side by side, no scoring language.
    if(state.phase==="reveal"){
      const agree = state.p1Choice===state.p2Choice;
      const eitherPassed = state.p1Choice==="pass" || state.p2Choice==="pass";
      const catLabel = (OK_NOK_CATS.find(c=>c[0]===state.card.category)||["","·"])[1];
      box.append(el("div",{class:"muted",style:"font-size:12px;letter-spacing:.4px;text-transform:uppercase"},catLabel));
      box.append(el("div",{style:"margin-top:10px;font-size:16px;line-height:1.5"},state.card.prompt));
      box.append(el("div",{style:"height:16px"}));
      box.append(el("div",{class:"row",style:"gap:10px"},
        el("div",{class:"card",style:"flex:1;text-align:center;padding:12px"},
          el("div",{class:"muted",style:"font-size:12px"},p1name),
          el("div",{style:"font-size:18px;font-weight:700;margin-top:4px"},choiceLabel(state.p1Choice))),
        el("div",{class:"card",style:"flex:1;text-align:center;padding:12px"},
          el("div",{class:"muted",style:"font-size:12px"},p2name),
          el("div",{style:"font-size:18px;font-weight:700;margin-top:4px"},choiceLabel(state.p2Choice)))
      ));
      box.append(el("div",{style:"height:14px"}));
      box.append(el("div",{class:"consent-box",style:"text-align:center"},
        eitherPassed ? "Bu soruyu geçtiniz." : agree ? "Aynı düşündünüz 🎉" : "Farklı düşündünüz — konuşmaya değer 💬"));
      box.append(el("div",{style:"height:14px"}));
      box.append(btn("Devam","primary",()=>nextCard()));
      return;
    }

    // Answering screen — only the current player should be looking at the phone.
    const catLabel = (OK_NOK_CATS.find(c=>c[0]===state.card.category)||["","·"])[1];
    box.append(el("div",{class:"muted",style:"font-size:12px;letter-spacing:.4px;text-transform:uppercase;display:flex;justify-content:space-between"},
      el("span",null,catLabel),
      el("span",null,(state.turn===1?p1name:p2name)+" cevaplıyor")));
    box.append(el("div",{class:"big",style:"margin-top:14px;font-size:20px;line-height:1.5;min-height:80px"},state.card.prompt));
    box.append(el("div",{style:"height:18px"}));

    const okBtn = el("button",{class:"btn primary",style:"flex:1;padding:20px;font-size:18px;font-weight:600"},"OK");
    const nokBtn = el("button",{class:"btn danger",style:"flex:1;padding:20px;font-size:18px;font-weight:600"},"NOK");
    okBtn.addEventListener("click",()=>answer("ok"));
    nokBtn.addEventListener("click",()=>answer("nok"));
    box.append(el("div",{class:"row",style:"gap:10px"}, okBtn, nokBtn));

    box.append(el("div",{style:"height:10px"}));
    const passBtn = btn("Pas","ghost",()=>answer("pass"));
    passBtn.style.width = "100%";
    box.append(passBtn);
  }

  nextCard();
});

const GUESSME_CATEGORIES = [
  {slug:"all",label:"Tümü"},
  {slug:"daily-life",label:"Günlük"},
  {slug:"preferences",label:"Tercihler"},
  {slug:"personality",label:"Karakter"},

  {slug:"relationship",label:"İlişki"},
  {slug:"funny-absurd",label:"Komik"},
  {slug:"dreams-future",label:"Hayaller"},
  {slug:"food-travel-fun",label:"Eğlence"},
  {slug:"flirt-intimacy",label:"Flört"},
];
function personalizeGuessMe(name, prompt){
  if(!prompt) return "";
  const first = prompt.charAt(0);
  const rest = prompt.slice(1);
  return name + " " + first.toLocaleLowerCase("tr-TR") + rest;
}
route("/guess-me",(app)=>{
  app.append(topbar("Beni Tahmin Et"));
  const settings = getSettings();
  const players = [settings.player1||"Ozzy", settings.player2||"Su"];
  const state = {
    filter: "all",
    playerIdx: Math.random()<0.5?0:1,
    card: null,
    stats: { rounds:0, correct:0, close:0, wrong:0, passes:0,
             byPlayer:{ [players[0]]:{correct:0,close:0,wrong:0},
                        [players[1]]:{correct:0,close:0,wrong:0} } }
  };

  const chipsWrap = el("div",{class:"chip-row",style:"margin-bottom:12px;overflow-x:auto;white-space:nowrap;display:flex;gap:8px;padding-bottom:4px"});
  app.append(chipsWrap);
  const info = el("div",{class:"muted",style:"margin-bottom:8px;font-size:13px"});
  app.append(info);
  const box = el("div",{class:"card"});
  app.append(box);

  function poolAll(){
    return loadPool("guessMe").filter(c=>c && !isDisabled("guessMe",c.id));
  }
  function poolFiltered(){
    const p = poolAll();
    return state.filter==="all" ? p : p.filter(c=>c.category===state.filter);
  }
  function drawGM(){
    const pool = poolFiltered();
    if(!pool.length) return null;
    const seen = new Set(getSeen("guessMe"));
    const unseen = pool.filter(c=>!seen.has(c.id));
    return unseen.length ? pick(unseen) : pick(pool);
  }
  function renderChips(){
    chipsWrap.innerHTML="";
    GUESSME_CATEGORIES.forEach(cat=>{
      const active = state.filter===cat.slug;
      chipsWrap.append(el("button",{
        class:"pill"+(active?" active":""),
        style:"flex:0 0 auto;"+(active?"background:#a73752;color:#f5ead8;border-color:#a73752":""),
        onclick:()=>{ state.filter=cat.slug; state.card=null; render(); }
      }, cat.label));
    });
  }
  function renderInfo(){
    const pool = poolFiltered();
    const seen = new Set(getSeen("guessMe"));
    const remaining = pool.filter(c=>!seen.has(c.id)).length;
    info.textContent = state.stats.rounds+" tur oynandı · "+remaining+" / "+pool.length+" kart kaldı";
  }
  function nextCard(){
    state.card = drawGM();
    render();
  }
  function record(kind){
    const p = players[state.playerIdx];
    state.stats.rounds++;
    if(kind==="pass"){ state.stats.passes++; bumpSession("guessMe","pass"); }
    else {
      state.stats[kind]++;
      state.stats.byPlayer[p][kind]++;
      bumpSession("guessMe","round");
      const s = getSession();
      s.modules.guessMe = s.modules.guessMe || {rounds:0,passes:0,score:0};
      s.modules.guessMe.score = (s.modules.guessMe.score||0) + (kind==="correct"?2:kind==="close"?1:0);
      storage.set(K.activeSession,s);
    }
    if(state.card) markSeen("guessMe", state.card.id);
    state.playerIdx = 1 - state.playerIdx;
    nextCard();
  }
  function render(){
    renderChips();
    renderInfo();
    box.innerHTML="";
    if(!state.card){
      const pool = poolFiltered();
      if(!pool.length){
        box.append(el("div",null,"Bu filtrede kart yok."));
        box.append(el("div",{style:"margin-top:12px"},
          btn("Tüm kategoriler","primary",()=>{state.filter="all";render()})
        ));
        return;
      }
      const seen = new Set(getSeen("guessMe"));
      const anyUnseen = pool.some(c=>!seen.has(c.id));
      if(!anyUnseen){
        box.append(el("div",{class:"big"},"Bu havuzdaki tüm kartlar geldi."));
        box.append(el("div",{class:"row",style:"margin-top:12px"},
          btn("Havuzu sıfırla ve devam et","primary",()=>{resetSeen("guessMe");nextCard()}),
          btn("Ana menü","ghost",()=>navigate("#/home"))
        ));
        return;
      }
      box.append(btn("Başla","primary",()=>nextCard()));
      return;
    }

    const asker  = players[state.playerIdx];       // hakkında tahmin yapılan
    const guesser= players[1-state.playerIdx];     // tahmin eden
    const question = personalizeGuessMe(asker, state.card.prompt || state.card.title || "");

    box.append(el("div",{class:"muted",style:"font-size:13px"},
      "Sıra: "+guesser+", "+asker+" hakkında tahmin yap"));
    box.append(el("h2",{style:"margin:10px 0 4px;line-height:1.35"}, question));
    if(state.card.category){
      const catLabel = (GUESSME_CATEGORIES.find(c=>c.slug===state.card.category)||{}).label || state.card.category;
      box.append(el("div",{class:"muted",style:"font-size:12px;margin-bottom:12px"}, catLabel));
    }

    const btnRow = el("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"});
    btnRow.append(btn("Bildin","primary",()=>record("correct")));
    btnRow.append(btn("Yaklaştın","gold",()=>record("close")));
    btnRow.append(btn("Bilemedin","ghost",()=>record("wrong")));
    btnRow.append(btn("Pas","ghost",()=>record("pass")));
    box.append(btnRow);

    const foot = el("div",{class:"row",style:"margin-top:14px;gap:8px;flex-wrap:wrap"});
    foot.append(btn("Sonraki","ghost",()=>{
      if(state.card) markSeen("guessMe",state.card.id);
      state.playerIdx = 1 - state.playerIdx;
      nextCard();
    }));
    foot.append(btn("Bir daha gösterme","ghost",()=>{
      if(state.card){ disableCard("guessMe",state.card.id); markSeen("guessMe",state.card.id); }
      state.playerIdx = 1 - state.playerIdx;
      nextCard();
    }));
    foot.append(btn("Ana menü","ghost",()=>navigate("#/home")));
    box.append(foot);

    if(state.stats.rounds>0 && state.stats.rounds%10===0){
      const st = state.stats;
      box.append(el("div",{class:"muted",style:"margin-top:14px;font-size:12px"},
        st.rounds+" soru · "+st.correct+" bildin · "+st.close+" yakın · "+st.wrong+" bilemedin"+(st.passes?" · "+st.passes+" pas":"")));
    }
  }
  render();
});

route("/sex-dice",(app)=>{
  maybeConsentReminder("sexDice",()=>renderDice(app));
});
function getCustomDice(){return storage.get("bizimOyun.customDice",{})}
function saveCustomDice(d){storage.set("bizimOyun.customDice",d)}
function getDiceDisabled(){return storage.get("bizimOyun.diceDisabled",{})}
function setDiceDisabled(d){storage.set("bizimOyun.diceDisabled",d)}
function disableDie(pool,val){const d=getDiceDisabled();d[pool]=d[pool]||{};d[pool][val]=true;setDiceDisabled(d)}
function isDieDisabled(pool,val){const d=getDiceDisabled();return !!(d[pool]&&d[pool][val])}
function poolValues(pool){
  const custom = getCustomDice()[pool]||[];
  let base = (DICE[pool]||[]).concat(custom);
  return base.filter(v=>!isDieDisabled(pool,v));
}
function renderDice(app){
  app.append(topbar("Sex Zarı"));
  const card = el("div",{class:"card"});
  app.append(card);
  const info = el("div",{class:"muted"},"Zarı at, çıkan pozisyonu uygula. Aynı pozisyon 'Yeni Oyun' diyene kadar tekrar gelmez. İlerlemen kaydedilir, sayfa yenilense de kalır.");
  card.append(info);
  const rollArea = el("div",{style:"margin-top:14px"});
  card.append(rollArea);
  const counter = el("div",{class:"muted",style:"margin-top:10px;text-align:center;font-size:13px"});
  card.append(counter);
  const rollBtn = btn("Zar At","primary",()=>roll());
  card.append(rollBtn);
  card.append(el("div",{style:"height:8px"}));
  card.append(btn("Yeni Oyun","ghost",()=>{ resetSeen("sexDice"); rollArea.innerHTML=""; updateCounter(); toast("Yeni oyun başladı."); }));

  // Full position pool — every position can come up, with an illustration when we have one,
  // name + description always. (Used to silently filter out anything without an image,
  // which meant ~9 out of 10 positions could never appear.)
  function allValues(){ return poolValues("pozisyon"); }
  function updateCounter(){
    const total = allValues().length;
    const seenCount = getSeen("sexDice").length;
    counter.textContent = total ? `Bu oyunda: ${seenCount} / ${total}` : "";
  }
  function roll(){
    const values = allValues();
    if(!values.length){ toast("Pozisyon havuzu boş. Ayarlar → Özel Kasa'dan ekleyebilirsin."); return; }
    const seenIds = getSeen("sexDice");
    const remaining = values.filter(v=>!seenIds.includes(hashStr(v)));
    if(!remaining.length){
      rollArea.innerHTML="";
      const done = el("div",{class:"card",style:"text-align:center;padding:16px"});
      done.append(el("div",{style:"font-size:20px;font-weight:700;color:var(--gold);margin-bottom:8px"},"Tüm pozisyonlar bitti"));
      done.append(el("div",{class:"muted"},"'Yeni Oyun' de, havuz sıfırdan başlasın."));
      rollArea.append(done);
      return;
    }
    const v = pick(remaining);
    markSeen("sexDice", hashStr(v));
    rollArea.innerHTML="";
    const name = v.split(" — ")[0];
    const desc = v.includes(" — ") ? v.slice(v.indexOf(" — ")+3) : "";
    const img = positionImage(v);
    const box = el("div",{class:"card",style:"text-align:center;padding:16px"});
    if(img){
      const im = document.createElement("img");
      im.src = img; im.alt = name;
      im.style.cssText = "max-width:100%;max-height:340px;border-radius:12px;margin:0 auto 12px;display:block";
      box.append(im);
    }
    box.append(el("div",{style:"font-size:22px;font-weight:700;color:var(--gold);margin-bottom:8px"},name));
    if(desc) box.append(el("div",{class:"muted",style:"line-height:1.5"},desc));
    rollArea.append(box);
    bumpSession("sexDice","round");
    updateCounter();
  }
  updateCounter();
  roll();
}

    "Aşağıdaki listedeki her pozisyon için bir resim seç. Görseller sıkıştırılıp (max 800px, JPEG) sadece bu tarayıcıda saklanır. Zar attığında ilgili pozisyona düşerse görsel otomatik gösterilir."
  ));
  const search = el("input",{type:"text",placeholder:"Ara: pozisyon adı..."});
  info.append(el("div",{style:"margin-top:10px"},search));
  const filterRow = el("div",{class:"pill-row",style:"margin-top:8px"});
  let filter = "all";
  const mkFilter=(id,label)=>{
    const b = el("button",{class:"pill"+(filter===id?" active":""),onclick:()=>{
      filter=id; filterRow.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); refresh();
    }},label);
    filterRow.append(b);
  };
  mkFilter("all","Tümü");
  mkFilter("missing","Görseli olmayan");
  mkFilter("mine","Benim yüklediğim");
  info.append(filterRow);
  app.append(info);

  const listBox = el("div",{class:"card"});
  app.append(listBox);

  search.addEventListener("input",()=>refresh());

  function refresh(){
    listBox.innerHTML="";
    const q = (search.value||"").toLowerCase().trim();
    const user = getUserImages();
    const positions = (DICE.pozisyon||[]);
    let shown = 0;
    positions.forEach(text=>{
      const key = positionKey(text);
      const name = text.split(" — ")[0];
      const hasUser = !!user[key];
      const hasBuiltin = (()=>{ const low=text.toLowerCase(); for(const k in POSITION_IMAGES){ if(low.startsWith(k)) return true; } return false; })();
      if(q && !name.toLowerCase().includes(q)) return;
      if(filter==="missing" && (hasUser||hasBuiltin)) return;
      if(filter==="mine" && !hasUser) return;
      shown++;
      const row = el("div",{class:"card",style:"margin-top:10px;padding:12px"});
      const head = el("div",{class:"kv"},
        el("div",null, el("div",{style:"font-weight:600"},name),
          el("div",{class:"muted",style:"font-size:12px;margin-top:2px"},
            hasUser?"✓ Kendi görselin":(hasBuiltin?"Yerleşik illüstrasyon":"Görsel yok"))),
        el("div",null)
      );
      row.append(head);
      const preview = el("div",{style:"margin-top:8px"});
      const cur = hasUser ? user[key] : (hasBuiltin ? positionImage(text) : null);
      if(cur){
        const img = document.createElement("img");
        img.src = cur; img.alt = name;
        img.style.cssText = "max-width:220px;max-height:160px;border-radius:8px;display:block";
        preview.append(img);
      }
      row.append(preview);
      const fileInp = el("input",{type:"file",accept:"image/*",style:"display:none"});
      fileInp.addEventListener("change", async ()=>{
        const f = fileInp.files && fileInp.files[0]; if(!f) return;
        try{
          const dataUrl = await compressImageFile(f);
          const u = getUserImages(); u[key] = dataUrl;
          if(setUserImages(u)){ toast("Yüklendi."); refresh(); }
        }catch(e){ toast("Resim okunamadı."); }
      });
      const actions = el("div",{class:"row",style:"margin-top:10px;gap:8px;flex-wrap:wrap"});
      actions.append(fileInp);
      actions.append(btn(hasUser?"Değiştir":"Görsel yükle","primary",()=>fileInp.click()));
      if(hasUser){
        actions.append(btn("Kaldır","danger",()=>{
          const u = getUserImages(); delete u[key]; setUserImages(u); refresh();
        }));
      }
      row.append(actions);
      listBox.append(row);
    });
    if(!shown) listBox.append(el("div",{class:"muted",style:"padding:12px"},"Eşleşen pozisyon yok."));
    else listBox.prepend(el("div",{class:"muted",style:"padding:0 0 8px"},shown+" pozisyon"));
  }
  refresh();
});



/* ============================================================
 * 20. Export / Import
 * ============================================================ */
function exportData(){
  const data = storage.getAll();
  const blob = new Blob([JSON.stringify({
    app:"bizim-oyun", version:SCHEMA_VERSION,
    exportedAt:nowIso(), data
  },null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bizim-oyun-yedek-"+today()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(){
  const input = document.createElement("input");
  input.type="file"; input.accept="application/json";
  input.onchange = async ()=>{
    const f = input.files && input.files[0]; if(!f) return;
    if(f.size > 2*1024*1024){toast("Dosya çok büyük.");return}
    try{
      const text = await f.text();
      const obj = JSON.parse(text);
      if(obj.app!=="bizim-oyun") throw new Error("Yanlış dosya.");
      if(obj.version!==SCHEMA_VERSION) throw new Error("Sürüm uyumsuz.");
      const keys = Object.keys(obj.data||{}).filter(k=>k.startsWith("bizimOyun."));
      openModal((box,close)=>{
        box.append(el("h3",null,"İçe aktar"));
        box.append(el("div",{class:"muted",style:"margin-top:8px"},keys.length+" anahtar bulundu. Nasıl yükleyelim?"));
        box.append(el("div",{style:"margin-top:12px"},btn("Birleştir","primary",()=>{doImport(obj.data,"merge");close()})));
        box.append(el("div",{style:"margin-top:8px"},btn("Tamamen değiştir","danger",()=>{doImport(obj.data,"replace");close()})));
        box.append(el("div",{style:"margin-top:8px"},btn("Vazgeç","ghost",close)));
      });
    }catch(e){toast("Geçersiz dosya: "+e.message)}
  };
  input.click();
}
function doImport(data,mode){
  if(mode==="replace"){storage.reset()}
  for(const k in data){
    if(!k.startsWith("bizimOyun."))continue;
    if(mode==="merge" && k.startsWith("bizimOyun.pool.")){
      const existing = storage.get(k,[]);
      const seen = new Set(existing.map(c=>c.id));
      const merged = existing.slice();
      (data[k]||[]).forEach(c=>{
        if(!c || !c.title || !c.prompt)return;
        const id = c.id || cardId(c.title,c.prompt);
        if(seen.has(id))return;
        merged.push({...c,id});
        seen.add(id);
      });
      storage.set(k,merged);
    } else {
      storage.set(k,data[k]);
    }
  }
  toast("İçe aktarıldı."); render();
}

/* ============================================================
 * 21. Boot
 * ============================================================ */
if(!runMigrations()){
  document.getElementById("app").append(el("div",{class:"card"},
    el("h3",null,"Veri okunamadı"),
    el("div",{class:"muted",style:"margin-top:8px"},"Bir yedek almak ister misin?"),
    el("div",{style:"margin-top:12px"},btn("Yedek al","primary",exportData))
  ));
} else {
  // Apply saved theme + reduced motion
  const _s = getSettings();
  if(_s.theme && _s.theme!=="bordo") document.documentElement.setAttribute("data-theme", _s.theme);
  document.documentElement.style.setProperty("--rm", _s.reducedMotion?"1":"0");
  document.documentElement.classList.toggle("reduced-motion", !!_s.reducedMotion);
  // Init all pools with core
  Object.keys(CORE).forEach(m=>loadPool(m));
  loadPool("guessMe");
  // Ensure a session exists
  if(!storage.get(K.activeSession,null)) startSession();
  render();
}

// resume param from landing
if(new URLSearchParams((location.hash.split("?")[1])||"").get("resume")==="1"){
  // no-op; session persists in localStorage
}
</script>
