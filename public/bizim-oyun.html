<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<title>Bizim Oyun</title>
<style>
:root{
  --bg:#10090c; --surface:#1b1015; --surface-2:#26151d;
  --wine:#7d2138; --wine-light:#a73752; --gold:#d9af61;
  --cream:#f5ead8; --muted:#bbaeb2; --danger:#c9505f; --success:#719b79;
  --radius:18px; --radius-lg:22px;
}
html[data-theme="gece"]{
  --bg:#08070f; --surface:#141327; --surface-2:#1e1a3a;
  --wine:#4b2a8a; --wine-light:#7a4dc7; --gold:#c3a6ff;
  --cream:#efeaff; --muted:#a9a2c9;
}
html[data-theme="orman"]{
  --bg:#0a0f0d; --surface:#12211a; --surface-2:#1a2f24;
  --wine:#2f6b4a; --wine-light:#4d9770; --gold:#d9c56a;
  --cream:#eef4e8; --muted:#a8b8ac;
}
.stop-fab{position:fixed;bottom:16px;right:16px;z-index:60;background:var(--danger);
  color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;
  box-shadow:0 10px 30px -10px rgba(201,80,95,.8);border:1px solid rgba(255,255,255,.15)}
.theme-chip{display:inline-block;width:22px;height:22px;border-radius:50%;
  border:2px solid transparent;margin-right:8px;vertical-align:middle;cursor:pointer}
.theme-chip.active{border-color:var(--gold)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior-y:contain}
body{min-height:100vh;min-height:100dvh;
  background:radial-gradient(1200px 700px at 50% -10%,#3a1420 0%,#10090c 55%,#0a0508 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--gold)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.01em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.app{max-width:520px;margin:0 auto;padding:20px 18px 100px;min-height:100vh;min-height:100dvh;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-size:14px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--surface-2)}
.iconbtn:hover{background:var(--surface-2)}
.card{background:linear-gradient(180deg,rgba(38,21,29,.85),rgba(27,16,21,.85));
  border:1px solid var(--surface-2);border-radius:var(--radius-lg);padding:20px;
  box-shadow:0 20px 60px -30px rgba(167,55,82,.6);backdrop-filter:blur(6px)}
.card + .card{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;
  border-radius:14px;background:var(--surface-2);color:var(--cream);font-weight:600;font-size:15px;
  border:1px solid transparent;min-height:48px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--wine-light),var(--wine));box-shadow:0 12px 30px -12px rgba(167,55,82,.9)}
.btn.gold{background:linear-gradient(135deg,#e6c079,#b98d3e);color:#2b1a08}
.btn.ghost{background:transparent;border-color:var(--surface-2);color:var(--muted)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.small{padding:10px 12px;font-size:13px;min-height:40px;width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 0;min-width:0}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--surface-2);
  color:var(--muted);font-size:12px;margin-right:6px;margin-top:6px}
.tag.gold{background:rgba(217,175,97,.15);color:var(--gold);border:1px solid rgba(217,175,97,.35)}
.tag.ai{background:rgba(167,55,82,.2);color:#f0b9c5;border:1px solid rgba(167,55,82,.5)}
.tag.custom{background:rgba(113,155,121,.15);color:#a9d1b1;border:1px solid rgba(113,155,121,.4)}
.muted{color:var(--muted)}
.center{text-align:center}
.hero-title{font-size:34px;margin-top:4px}
.hero-sub{color:var(--gold);font-style:italic;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--surface-2);
  text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.mod:hover{border-color:var(--gold)}
.mod .name{font-weight:700;font-size:15px}
.mod .desc{font-size:12px;color:var(--muted)}
.wheel-wrap{position:relative;width:260px;height:260px;margin:14px auto}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;
  transition:transform 4s cubic-bezier(.15,.85,.25,1);
  background:conic-gradient(from 0deg,#7d2138,#a73752,#d9af61,#7d2138,#a73752,#d9af61,#7d2138,#a73752);
  box-shadow:inset 0 0 0 6px #26151d,0 30px 60px -30px rgba(167,55,82,.7)}
.wheel::after{content:"";position:absolute;inset:24%;border-radius:50%;background:var(--surface);
  border:1px solid var(--surface-2);display:grid;place-items:center}
.wheel-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.wheel-center .lbl{font-size:12px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}
.wheel-center .val{font-size:15px;color:var(--cream);font-weight:700;margin-top:4px;max-width:120px;text-align:center}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
  border-top:18px solid var(--gold);z-index:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.overlay{position:fixed;inset:0;background:rgba(6,3,5,.85);display:grid;place-items:center;
  padding:20px;z-index:1000;backdrop-filter:blur(8px)}
.modal{background:var(--surface);border:1px solid var(--surface-2);border-radius:var(--radius-lg);
  padding:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.big{font-size:20px;font-weight:700}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-2);
  border:1px solid #3a2028;color:var(--cream);font:inherit;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.divider{height:1px;background:var(--surface-2);margin:16px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:11px;
  background:var(--surface-2);color:var(--muted)}
.hidden{display:none!important}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted);
  font-size:13px;border:1px solid transparent;cursor:pointer}
.pill.active{background:var(--wine);color:var(--cream);border-color:var(--wine-light)}
.dice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.die{background:var(--surface-2);border-radius:14px;padding:12px;text-align:center;
  min-height:80px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid #3a2028}
.die .k{font-size:11px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}
.die .v{font-size:15px;font-weight:600;margin-top:4px}
.die.pozisyon-with-image{grid-column:1/-1;padding:0;overflow:hidden}
.die .pos-img{width:100%;max-height:260px;object-fit:contain;background:#fff;display:block}
.die .pos-body{padding:12px}
.die.rolling{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--gold);
  border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface-2);color:var(--cream);padding:12px 18px;border-radius:12px;
  border:1px solid var(--gold);z-index:2000;font-size:14px;max-width:90vw;text-align:center}
.hide-answer{filter:blur(18px);pointer-events:none;user-select:none}
.answers{display:flex;gap:8px}
.answers .btn{flex:1}
.consent-box{background:rgba(217,175,97,.08);border:1px solid rgba(217,175,97,.35);
  border-radius:14px;padding:14px;color:var(--cream);font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,9,12,.92);
  backdrop-filter:blur(10px);border-top:1px solid var(--surface-2);padding:8px 12px;z-index:50}
.bottom-nav .inner{max-width:520px;margin:0 auto;display:flex;justify-content:space-around}
.bottom-nav a{color:var(--muted);text-decoration:none;padding:6px 10px;font-size:12px;
  border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom-nav a.active{color:var(--gold)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--surface-2)}
.kv:last-child{border:0}
@media (prefers-reduced-motion: reduce){
  .wheel{transition:none}
  .die.rolling{animation:none}
}
</style>
</head>

<script type="module">
"use strict";

/* ============================================================
 * 1. Constants & schemas
 * ============================================================ */
const SCHEMA_VERSION = 1;
const K = {
  meta:"bizimOyun.meta",
  settings:"bizimOyun.settings",
  pool:(m)=>`bizimOyun.pool.${m}`,
  seen:(m)=>`bizimOyun.seen.${m}`,
  custom:"bizimOyun.custom",
  disabled:"bizimOyun.disabled",
  favorites:"bizimOyun.favorites",
  sessions:"bizimOyun.sessions",
  activeSession:"bizimOyun.activeSession",
  daily:"bizimOyun.dailyQuestion",
  consent:"bizimOyun.consent",
};

const MODULES = {
  warmup:{name:"Isınma",desc:"Hafif, tanışma soruları",icon:"🌱"},
  flirt:{name:"Flört",desc:"Göz kırpan sorular",icon:"💋"},
  intimacy:{name:"Yakınlaşma",desc:"Duygusal ve fiziksel derinlik",icon:"🔥"},
  memories:{name:"Anılarımız",desc:"Ortak hikâyeler",icon:"📖"},
  party:{name:"Parti Oyunları",desc:"6 mini oyun",icon:"🎲"},
  okNok:{name:"OK mu NOK mu?",desc:"Gizli cevap, birlikte açma",icon:"🤔"},
  guessMe:{name:"Beni Tahmin Et",desc:"Birbirinizi ne kadar tanıyorsunuz?",icon:"💭"},
  sexDice:{name:"Sex Zarı",desc:"Yetişkin, rızaya dayalı",icon:"🎯"},
};

const LEVELS = ["warmup","flirt","intimacy","memories"];
const PARTY = ["truth","dare","whoAmI","taboo","charades","rapidFire","story","sameThought","secretMission","touchBingo"];
const PARTY_NAMES = {
  truth:"Doğruluk", dare:"Cesaret", whoAmI:"Ben Kimim?", taboo:"Tabu-lite",
  charades:"Sessiz Sinema", rapidFire:"Hızlı Ateş", story:"Hikâye Tamamla",
  sameThought:"Aynı Anda", secretMission:"Gizli Görev", touchBingo:"Dokunma Bingo"
};

/* ============================================================
 * 2. Utility functions
 * ============================================================ */
function hashStr(s){let h=5381;s=String(s);for(let i=0;i<s.length;i++)h=((h<<5)+h)+s.charCodeAt(i);return(h>>>0).toString(36)}
function cardId(title,prompt){return "c_"+hashStr((title||"")+"|"+(prompt||""))}
function today(){return new Date().toISOString().slice(0,10)}
function nowIso(){return new Date().toISOString()}
function uid(){return "u_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="style")e.setAttribute("style",attrs[k]);
    else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2),attrs[k]);
    else if(k==="html")e.innerHTML=attrs[k]; // only for trusted static strings
    else if(attrs[k]!=null&&attrs[k]!==false)e.setAttribute(k,attrs[k]);
  }
  for(const kid of kids){
    if(kid==null||kid===false)continue;
    if(Array.isArray(kid))kid.forEach(k=>k!=null&&e.append(k.nodeType?k:document.createTextNode(String(k))));
    else e.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  }
  return e;
}
function toast(msg,ms=2200){
  const t=el("div",{class:"toast"},msg);
  document.getElementById("toast-root").append(t);
  setTimeout(()=>t.remove(),ms);
}

/* ============================================================
 * 3. Storage helpers
 * ============================================================ */
const storage = {
  get(k,fallback){
    try{const raw=localStorage.getItem(k);if(raw==null)return fallback;
      const v=JSON.parse(raw);return v==null?fallback:v;
    }catch{return fallback}
  },
  set(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));return true}
    catch(e){toast("Depolama alanı dolu.");return false}
  },
  remove(k){try{localStorage.removeItem(k)}catch{}},
  getAll(){
    const out={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith("bizimOyun."))out[k]=storage.get(k,null);
    }
    return out;
  },
  reset(){
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith("bizimOyun."))keys.push(k);
    }
    keys.forEach(k=>localStorage.removeItem(k));
  }
};

/* ============================================================
 * 4. Migrations
 * ============================================================ */
const migrations = {
  1(data){ return data; }
};
function runMigrations(){
  const meta = storage.get(K.meta,null);
  if(!meta){
    storage.set(K.meta,{schemaVersion:SCHEMA_VERSION,createdAt:nowIso(),updatedAt:nowIso()});
    return true;
  }
  let v = meta.schemaVersion||1;
  try{
    while(v<SCHEMA_VERSION){
      v++;
      if(migrations[v]) migrations[v]();
    }
    storage.set(K.meta,{...meta,schemaVersion:SCHEMA_VERSION,updatedAt:nowIso()});
    return true;
  }catch(e){
    return false;
  }
}

/* ============================================================
 * 5. Core card pools
 * ============================================================ */
function mk(title,prompt,{tags=[],category="genel",hardness=2,source="core",type="question"}={}){
  return {id:cardId(title,prompt),title,prompt,tags,category,hardness,type,source,disabled:false};
}

const CORE = {
  warmup: [
    // ——— Günlük Hayat (daily-life) · 15
    mk("Sabah ilk on dakika","Sabah uyandığında ilk on dakikayı istediğin gibi tasarlayabilsen ne yapardın?",{tags:["ısınma","sabah","rutin"],category:"daily-life",hardness:1}),
    mk("Küçük gizli an","Günün en sevdiğin ama genelde kimseye anlatmadığın küçük anı hangisi?",{tags:["ısınma","gündelik"],category:"daily-life",hardness:1}),
    mk("Yalnızken garip","Evde kimse seni görmüyorken yaptığın en garip şey ne?",{tags:["ısınma","komik"],category:"daily-life",hardness:1}),
    mk("İlk uygulama","Sabah telefonunu açtığında refleksle girdiğin ilk uygulama hangisi ve seni ne çekiyor?",{tags:["ısınma","telefon"],category:"daily-life",hardness:1}),
    mk("Buzdolabı klasiği","Aç olmasan bile buzdolabını açınca aradığın şey ne oluyor?",{tags:["ısınma","yemek"],category:"daily-life",hardness:1}),
    mk("Uyku ritüeli","Uyumadan önce vazgeçemediğin küçük bir alışkanlığın var mı?",{tags:["ısınma","uyku"],category:"daily-life",hardness:1}),
    mk("Enerji artıran","Gün ortasında seni birden ayağa kaldıran, küçük ama işe yarayan bir şey ne?",{tags:["ısınma","enerji"],category:"daily-life",hardness:1}),
    mk("Ev sesi","Evde en çok özlediğin ses hangisi: mutfaktan gelen, dışarıdan gelen, yoksa sessizlik mi?",{tags:["ısınma","ev"],category:"daily-life",hardness:1}),
    mk("Sepete atmak","Markette hep sepete atıp sonra 'bunu neden aldım' dediğin bir şey var mı?",{tags:["ısınma","alışveriş"],category:"daily-life",hardness:1}),
    mk("Yeni haftalık","Yeni bir hafta başlarken en çok neyi iple çekiyorsun?",{tags:["ısınma","haftalık"],category:"daily-life",hardness:1}),
    mk("Yağmurlu ev","Dışarıda yağmur varken evdeki en sevdiğin köşen neresi olur?",{tags:["ısınma","ev"],category:"daily-life",hardness:1}),
    mk("Küçük lüks","Kendine sıkça izin verdiğin küçük bir lüks var mı?",{tags:["ısınma","zevk"],category:"daily-life",hardness:1}),
    mk("Yalnız hafta sonu","Bir hafta sonu tamamen evde tek başına kalsan sıkılmadan neler yapardın?",{tags:["ısınma","hafta sonu"],category:"daily-life",hardness:1}),
    mk("Yemek modu","Aç değilken bile 'canım şunu ister' dediğin bir yemek ne?",{tags:["ısınma","yemek"],category:"daily-life",hardness:1}),
    mk("Gece atıştırma","Gece geç saatte mutfağa girsen büyük ihtimalle önüne ne koyarsın?",{tags:["ısınma","gece"],category:"daily-life",hardness:1}),

    // ——— Hızlı Tercihler (quick-choice) · 15
    mk("Plansız mı planlı mı","Plansız bir gece gezmesi mi, haftalar öncesinden hazırlanmış mükemmel bir plan mı? Neden?",{tags:["ısınma","tercih"],category:"quick-choice",hardness:1}),
    mk("Deniz mi dağ mı","Bir hafta tatilde: deniz kenarı mı, dağ evi mi? Kısaca gerekçe.",{tags:["ısınma","tatil"],category:"quick-choice",hardness:1}),
    mk("Yazmak mı aramak mı","Uzun bir konuyu anlatırken yazmayı mı, aramayı mı seçersin? Neden?",{tags:["ısınma","iletişim"],category:"quick-choice",hardness:1}),
    mk("Sabahçı mı akşamcı mı","Kendini gerçekten hangi saatlerde daha canlı hissediyorsun?",{tags:["ısınma","enerji"],category:"quick-choice",hardness:1}),
    mk("Ev mi dışarı mı","Cuma akşamı seçenek çıksa: ev-kanepe mi, sokak-kalabalık mı? Neden?",{tags:["ısınma","cuma"],category:"quick-choice",hardness:1}),
    mk("Tatlı mı tuzlu mu","Yemek sonrası tatlı zorunlu mu, yoksa tuzlu bir şey mi iyi kapatır?",{tags:["ısınma","damak"],category:"quick-choice",hardness:1}),
    mk("Sürpriz mi bilgi mi","Hediye önceden söylenip beklenmesi mi, tamamen sürpriz olması mı? Neden?",{tags:["ısınma","hediye"],category:"quick-choice",hardness:1}),
    mk("Şehir mi doğa mı","Bir yıl yaşama şansın olsa yoğun bir şehir mi, sakin bir doğa mı?",{tags:["ısınma","yaşam"],category:"quick-choice",hardness:1}),
    mk("Fotoğraf mı an mı","Güzel bir sahneyi fotoğrafla ölümsüzleştirmek mi, sadece bakıp geçmek mi?",{tags:["ısınma","an"],category:"quick-choice",hardness:1}),
    mk("Uzun tatil, sık kaçış","Yılda tek uzun tatil mi, sık sık kısa kaçamaklar mı? Neden?",{tags:["ısınma","tatil"],category:"quick-choice",hardness:1}),
    mk("Yeni mi klasik mi","Restoranda yeni bir şey mi denersin, sevdiğin klasiği mi ısmarlarsın?",{tags:["ısınma","yemek"],category:"quick-choice",hardness:1}),
    mk("Kitap mı dizi mi","Aynı hikâye kitap ve dizi olarak varsa hangisiyle başlarsın? Neden?",{tags:["ısınma","hikaye"],category:"quick-choice",hardness:1}),
    mk("Kahvaltı mı brunch mı","Erken hafif kahvaltı mı, geç kalkıp uzun brunch mı?",{tags:["ısınma","sabah"],category:"quick-choice",hardness:1}),
    mk("Ev partisi mi bar mı","Kalabalık akşam için evde küçük bir parti mi, dışarıda bar mı?",{tags:["ısınma","gece"],category:"quick-choice",hardness:1}),
    mk("Duş mu küvet mi","Yorgun bir günün sonunda hızlı duş mu, uzun küvet mi?",{tags:["ısınma","dinlenme"],category:"quick-choice",hardness:1}),

    // ——— Komik ve Absürt (funny-absurd) · 15

function positionKey(text){
  if(!text) return "";
  const low = text.toLowerCase();
  const idx = low.indexOf(" — ");
  return (idx>0 ? low.slice(0,idx) : low).trim();
}
function positionImage(text){
  if(!text) return null;
  const low = text.toLowerCase();
  const user = getUserImages();
  const k = positionKey(text);
  if(k && user[k]) return user[k];
  for(const key in POSITION_IMAGES){ if(low.startsWith(key)) return POSITION_IMAGES[key]; }
  return null;
}
function compressImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 800;
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadPool(mod){
  const stored = storage.get(K.pool(mod),null);
  const core = (CORE[mod]||[]).slice();
  if(stored && Array.isArray(stored) && stored.length){
    // Merge new core cards without touching user's ai/custom/seen/favorites/disabled state.
    const have = new Set(stored.map(c=>c && c.id).filter(Boolean));
    let changed = false;
    for(const c of core){
      if(!have.has(c.id)){ stored.push(c); have.add(c.id); changed = true; }
    }
    if(changed) storage.set(K.pool(mod),stored);
    return stored;
  }
  storage.set(K.pool(mod),core);
  return core;
}

function drawCard(mod,opts){
  const category = opts && opts.category;
  const maxHardness = opts && opts.maxHardness;
  const minHardness = opts && opts.minHardness;
  const excludeId = opts && opts.excludeId;
  let pool = loadPool(mod).filter(c=>c && !isDisabled(mod,c.id));

  if(typeof minHardness === "number") pool = pool.filter(c=>(c.hardness||2)>=minHardness);
  if(excludeId) pool = pool.filter(c=>c.id!==excludeId);
  if(!pool.length) return null;
  const s = getSettings();
  if(s.favoritesOnly){
    const favs = getFavorites()[mod]||{};
    const favPool = pool.filter(c=>favs[c.id]);
    if(favPool.length) pool = favPool;
  }
  const seen = new Set(getSeen(mod));
  const unseenAi = pool.filter(c=>c.source==="ai" && !seen.has(c.id));
  if(unseenAi.length) return pick(unseenAi);
  const unseenCustom = pool.filter(c=>c.source==="custom" && !seen.has(c.id));
  if(unseenCustom.length) return pick(unseenCustom);
  const unseenCore = pool.filter(c=>c.source==="core" && !seen.has(c.id));

  if(opts && opts.allowSeen && pool.length) return pick(pool);
  return {__exhausted:true};
}

function countUnseen(mod,opts){
  const category = opts && opts.category;

  let pool = loadPool(mod).filter(c=>c && !isDisabled(mod,c.id));

  return pool.filter(c=>!seen.has(c.id)).length;
}

  let c = drawCard(mod,{category, maxHardness:cap, excludeId:currentCard?.id});
  if(!c || c.__exhausted) c = drawCard(mod,{maxHardness:cap, excludeId:currentCard?.id});
  if(!c || c.__exhausted) c = drawCard(mod,{maxHardness:cap, excludeId:currentCard?.id, allowSeen:true});
  return c;
}

function addCards(mod,newCards){
  const pool = loadPool(mod);
  const existing = new Set(pool.map(c=>c.id));
  let added=0;
  for(const c of newCards){
    const id = c.id || cardId(c.title,c.prompt);
    if(existing.has(id))continue;
    pool.push({...c,id,disabled:false});
    existing.add(id);
    added++;
  }
  savePool(mod,pool);
  return added;
}

/* ============================================================
 * 7. Session tracking
 * ============================================================ */
function startSession(){
  const s = {
    id:uid(), startedAt:nowIso(), endedAt:null,
    players:[getSettings().player1,getSettings().player2],
    modules:{}, totalRounds:0, totalPasses:0
  };
  storage.set(K.activeSession,s);
  return s;
}
function getSession(){
  let s = storage.get(K.activeSession,null);
  if(!s){s=startSession()}
  return s;
}
function bumpSession(mod,kind){
  const s=getSession();
  s.modules[mod]=s.modules[mod]||{rounds:0,passes:0};
  if(kind==="round"){s.modules[mod].rounds++;s.totalRounds++}
  if(kind==="pass"){s.modules[mod].passes++;s.totalPasses++}
  storage.set(K.activeSession,s);
}
function sessionSet(mod,patch){
  const s=getSession();
  s.modules[mod]=s.modules[mod]||{rounds:0,passes:0};
  Object.assign(s.modules[mod],patch);
  storage.set(K.activeSession,s);
}
function endSession(){
  const s=getSession();s.endedAt=nowIso();
  const list=storage.get(K.sessions,[]);
  list.unshift(s);
  storage.set(K.sessions,list.slice(0,50));
  storage.remove(K.activeSession);
  return s;
}

/* ============================================================
 * 8. Daily question
 * ============================================================ */
function getDailyQuestion(){
  const d = storage.get(K.daily,null);
  const t = today();
  if(d && d.date===t){
    for(const m of LEVELS){
      const pool = loadPool(m);
      const found = pool.find(c=>c.id===d.id);
      if(found) return {card:found,mod:m};
    }
  }
  // pick a fresh one from any level, guarding flirt to only question-type & hardness<=2
  const all=[];
  for(const m of LEVELS){
    for(const c of loadPool(m)){
      if(isDisabled(m,c.id)) continue;
      if(m==="flirt"){
        const t = c.type||"question";
        if(t!=="question" && t!=="choice" && t!=="guess") continue;
        if((c.hardness||2) > 2) continue;
      }
      all.push({card:c,mod:m});
    }
  }
  if(!all.length) return null;
  const pickIt = all[Math.floor(Math.random()*all.length)];
  storage.set(K.daily,{date:t,id:pickIt.card.id,mod:pickIt.mod});
  return pickIt;
}

  const cls = "btn "+(variant||"");

function topbar(title){
  return el("div",{class:"topbar"},
    el("button",{class:"iconbtn","aria-label":"Geri",onclick:()=>history.length>1?history.back():navigate("#/home")},"←"),
    el("div",{class:"brand"},title||""),
    el("button",{class:"iconbtn","aria-label":"Ayarlar",onclick:()=>navigate("#/settings")},"⚙")
  );
}
function openModal(contentFn){
  const root = document.getElementById("overlay-root");
  root.innerHTML="";
  const closer = ()=>{root.innerHTML=""};
  const box = el("div",{class:"modal",role:"dialog","aria-modal":"true"});
  root.append(el("div",{class:"overlay",onclick:(e)=>{if(e.target.classList.contains("overlay"))closer()}}, box));
  contentFn(box,closer);
  // focus trap: focus first focusable
  setTimeout(()=>{const f=box.querySelector("button,input,textarea,select,a");f&&f.focus()},20);
  const esc=(e)=>{if(e.key==="Escape"){closer();document.removeEventListener("keydown",esc)}};
  document.addEventListener("keydown",esc);
  return closer;
}
function tagList(card){
  const tags=[];
  if(card.source==="ai") tags.push(el("span",{class:"tag ai"},"AI"));
  if(card.source==="custom") tags.push(el("span",{class:"tag custom"},"özel"));

  return el("div",{style:"margin-top:8px"},...tags);
}

 * 11. AI client
 * ============================================================ */
function aiAvailable(){
  return location.protocol!=="file:" && (typeof navigator==="undefined" || navigator.onLine!==false);
}
async function generateCards(payload){
  if(!aiAvailable()) throw new Error("offline");
  const res = await fetch("/api/public/bizim-oyun-generate",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({ok:false,code:"INVALID_AI_RESPONSE",message:"Cevap işlenemedi."}));
  if(!res.ok || !data.ok){
    const map={
      RATE_LIMITED:"Çok sık istek. Biraz sonra dene.",
      PAYMENT_REQUIRED:"AI kredisi tükendi.",
      AI_UNAVAILABLE:"AI şu an kullanılamıyor.",
      INVALID_AI_RESPONSE:"AI cevabı işlenemedi.",
      INVALID_REQUEST:"İstek geçersiz.",
      INTERNAL_ERROR:"Beklenmedik bir hata."
    };
    throw new Error(map[data.code] || data.message || "Hata");
  }
  return data.cards;
}

async function requestAi(mod,box,onNext){

  const modKey = moduleMap[mod]||mod;

      module:modKey,
      level:LEVELS.includes(mod)?mod:undefined,
      count:5,
      hardness:clamp(settings.hardness||3,1,5),
      avoidTitles
    });
    const normalized = cards.map(c=>({
      title:c.title,prompt:c.prompt,tags:c.tags||[],

function loadGuessMePool(){
  const stored = storage.get(K.pool("guessMe"),null);
  if(stored && Array.isArray(stored) && stored.length) return stored;
  const seed = CORE.guessMe.map(q=>({
    id:cardId(q.q,q.type),
    title:q.q,prompt:q.q,tags:[q.type],category:q.category||"soru",
    hardness:2,source:"core",disabled:false,type:q.type,options:q.options||null
  }));
  storage.set(K.pool("guessMe"),seed);
  return seed;
}
route("/guess-me",(app)=>{
  app.append(topbar("Beni Tahmin Et"));
  const box = el("div",{class:"card"});
  app.append(box);
  const settings = getSettings();
  const state = { phase:"pick", card:null, playerIdx:0, secret:null, guess:null };
  function drawGM(){
    const pool = loadGuessMePool().filter(c=>!isDisabled("guessMe",c.id));
    const seen = new Set(getSeen("guessMe"));
    const unseen = pool.filter(c=>!seen.has(c.id));
    return unseen.length?pick(unseen):pool.length?pick(pool):null;
  }
  function render(){
    box.innerHTML="";
    const players=[settings.player1,settings.player2];
    if(state.phase==="pick"){
      box.append(el("div",{class:"muted"},"Kim kendini anlatacak?"));
      box.append(el("div",{class:"row",style:"margin-top:12px"},
        btn(players[0],"primary",()=>{state.playerIdx=0;state.card=drawGM();
          if(!state.card){box.innerHTML="";box.append(el("div",null,"Soru bitti."));return}
          markSeen("guessMe",state.card.id);bumpSession("guessMe","round");
          state.phase="secret";render()}),
        btn(players[1],"gold",()=>{state.playerIdx=1;state.card=drawGM();
          if(!state.card){box.innerHTML="";box.append(el("div",null,"Soru bitti."));return}
          markSeen("guessMe",state.card.id);bumpSession("guessMe","round");
          state.phase="secret";render()})
      ));
    } else if(state.phase==="secret"){
      const p = players[state.playerIdx];
      box.append(el("div",{class:"big"},p+" gerçek cevabını gizlice ver"));
      box.append(el("h3",{style:"margin-top:8px"},state.card.title));
      renderAnswerInput(box,state.card,(v)=>{state.secret=v;state.phase="pass";render()});
    } else if(state.phase==="pass"){
      const other = players[1-state.playerIdx];
      box.append(el("div",{class:"big center"},"Telefonu "+other+"'e ver"));
      box.append(el("div",{style:"height:12px"}));
      box.append(btn("Hazırım","primary",()=>{state.phase="guess";render()}));
    } else if(state.phase==="guess"){
      const other = players[1-state.playerIdx];
      box.append(el("div",{class:"big"},other+" tahminini gir"));
      box.append(el("h3",{style:"margin-top:8px"},state.card.title));
      renderAnswerInput(box,state.card,(v)=>{state.guess=v;state.phase="reveal";render()});
    } else if(state.phase==="reveal"){
      box.append(el("h3",null,state.card.title));
      box.append(el("div",{class:"row",style:"margin-top:12px"},
        el("div",{class:"card",style:"flex:1;padding:12px"},
          el("div",{class:"muted"},"Gerçek"),
          el("div",{style:"margin-top:6px;font-weight:600"},String(state.secret))),
        el("div",{class:"card",style:"flex:1;padding:12px"},
          el("div",{class:"muted"},"Tahmin"),
          el("div",{style:"margin-top:6px;font-weight:600"},String(state.guess)))
      ));
      box.append(el("div",{class:"muted",style:"margin-top:12px"},"Cevaplayan değerlendirsin:"));
      const s = getSession();
      s.modules.guessMe = s.modules.guessMe || {rounds:0,passes:0,score:0};
      function award(pts,label){
        s.modules.guessMe.score = (s.modules.guessMe.score||0)+pts;
        storage.set(K.activeSession,s);
        toast(label+" (+"+pts+")");
        state.phase="pick"; render();
      }
      box.append(el("div",{class:"row",style:"margin-top:8px"},
        btn("Bilemedi","ghost",()=>award(0,"Bilemedi")),
        btn("Yaklaştı","gold",()=>award(1,"Yaklaştı")),
        btn("Bildi","primary",()=>award(2,"Bildi"))
      ));
    }
  }
  render();
});
function renderAnswerInput(box,card,onDone){
  const t = card.type||"text";
  if(t==="choice" && card.options){
    const wrap = el("div",{style:"margin-top:12px"});
    card.options.forEach(op=>{
      wrap.append(el("button",{class:"btn ghost",style:"margin-bottom:8px",onclick:()=>onDone(op)},op));
    });
    box.append(wrap);
  } else if(t==="scale"){
    const wrap = el("div",{class:"pill-row",style:"margin-top:12px;justify-content:center"});
    [1,2,3,4,5].forEach(n=>{
      wrap.append(el("button",{class:"pill",onclick:()=>onDone(n)},String(n)));
    });
    box.append(wrap);
  } else if(t==="binary"){
    box.append(el("div",{class:"row",style:"margin-top:12px"},
      btn("Evet","primary",()=>onDone("Evet")),
      btn("Hayır","ghost",()=>onDone("Hayır"))
    ));
  } else {
    const inp = el("input",{type:"text",placeholder:"Cevabını yaz…"});
    const b = btn("Onayla","primary",()=>{const v=(inp.value||"").trim().slice(0,120);if(!v)return;onDone(v)});
    box.append(el("div",{style:"margin-top:12px"},inp));
    box.append(el("div",{style:"margin-top:10px"},b));
  }
}

function getCustomDice(){return storage.get("bizimOyun.customDice",{})}
function saveCustomDice(d){storage.set("bizimOyun.customDice",d)}
function getDiceDisabled(){return storage.get("bizimOyun.diceDisabled",{})}
function setDiceDisabled(d){storage.set("bizimOyun.diceDisabled",d)}
function disableDie(pool,val){const d=getDiceDisabled();d[pool]=d[pool]||{};d[pool][val]=true;setDiceDisabled(d)}
function isDieDisabled(pool,val){const d=getDiceDisabled();return !!(d[pool]&&d[pool][val])}
function poolValues(pool){
  const custom = getCustomDice()[pool]||[];
  let base = (DICE[pool]||[]).concat(custom);
  return base.filter(v=>!isDieDisabled(pool,v));
}
function renderDice(app){
  app.append(topbar("Sex Zarı"));
  const card = el("div",{class:"card"});
  app.append(card);
  const info = el("div",{class:"muted"},"Zarı at, çıkan pozisyonu uygula. Aynı pozisyon 'Yeni Oyun' diyene kadar tekrar gelmez.");
  card.append(info);
  const rollArea = el("div",{style:"margin-top:14px"});
  card.append(rollArea);
  const counter = el("div",{class:"muted",style:"margin-top:10px;text-align:center;font-size:13px"});
  card.append(counter);
  const rollBtn = btn("Zar At","primary",()=>roll());
  card.append(rollBtn);
  card.append(el("div",{style:"height:8px"}));
  card.append(btn("Yeni Oyun","ghost",()=>{ seen.clear(); rollArea.innerHTML=""; updateCounter(); toast("Yeni oyun başladı."); }));

  const seen = new Set();
  function allValues(){ return poolValues("pozisyon").filter(v=>!!positionImage(v)); }
  function updateCounter(){
    const total = allValues().length;
    counter.textContent = total ? `Bu oyunda: ${seen.size} / ${total}` : "";
  }
  function roll(){
    const values = allValues();
    if(!values.length){ toast("Görselli pozisyon yok. Ayarlar → Pozisyon Görselleri'nden ekleyebilirsin."); return; }
    const remaining = values.filter(v=>!seen.has(v));
    if(!remaining.length){
      rollArea.innerHTML="";
      const done = el("div",{class:"card",style:"text-align:center;padding:16px"});
      done.append(el("div",{style:"font-size:20px;font-weight:700;color:var(--gold);margin-bottom:8px"},"Tüm pozisyonlar bitti"));
      done.append(el("div",{class:"muted"},"'Yeni Oyun' de, havuz sıfırdan başlasın."));
      rollArea.append(done);
      return;
    }
    const v = pick(remaining);
    seen.add(v);
    rollArea.innerHTML="";
    const name = v.split(" — ")[0];
    const desc = v.includes(" — ") ? v.slice(v.indexOf(" — ")+3) : "";
    const img = positionImage(v);
    const box = el("div",{class:"card",style:"text-align:center;padding:16px"});
    if(img){
      const im = document.createElement("img");
      im.src = img; im.alt = name;
      im.style.cssText = "max-width:100%;max-height:340px;border-radius:12px;margin:0 auto 12px;display:block";
      box.append(im);
    }
    box.append(el("div",{style:"font-size:22px;font-weight:700;color:var(--gold);margin-bottom:8px"},name));
    if(desc) box.append(el("div",{class:"muted",style:"line-height:1.5"},desc));
    rollArea.append(box);
    bumpSession("sexDice","round");
    updateCounter();
  }
  updateCounter();
  roll();
}

    {id:"orman",name:"Orman",colors:["#2f6b4a","#d9c56a","#0a0f0d"]},
  ];
  const themeRow = el("div",{class:"pill-row"});
  themes.forEach(t=>{
    const active = (s.theme||"bordo")===t.id;
    const b = el("button",{class:"pill"+(active?" active":""),onclick:()=>{
      s.theme=t.id;saveSettings(s);
      document.documentElement.setAttribute("data-theme", t.id==="bordo"?"":t.id);
      themeRow.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
    }},t.name);
    themeRow.append(b);
  });
  box.append(themeRow);

  // Reduced motion
  box.append(el("div",{class:"divider"}));
  const rmBtn = btn(s.reducedMotion?"Az animasyon: AÇIK":"Az animasyon: KAPALI","ghost",()=>{
    s.reducedMotion=!s.reducedMotion;saveSettings(s);
    document.documentElement.style.setProperty("--rm",s.reducedMotion?"1":"0");
    render();
  });
  box.append(rmBtn);

  // Only favorites toggle
  const favOnlyBtn = btn(s.favoritesOnly?"Sadece favoriler: AÇIK":"Sadece favoriler: KAPALI","ghost",()=>{
    s.favoritesOnly=!s.favoritesOnly;saveSettings(s);
    favOnlyBtn.textContent = s.favoritesOnly?"Sadece favoriler: AÇIK":"Sadece favoriler: KAPALI";
    toast(s.favoritesOnly?"Sadece favori kartlar gösterilecek.":"Tüm kartlar gösterilecek.");
  });
  box.append(el("div",{style:"margin-top:10px"},favOnlyBtn));

  // custom cards
  const cbox = el("div",{class:"card"});
  app.append(cbox);
  cbox.append(el("h3",null,"Özel Kart Ekle"));
  const modSel = el("select");
  [...LEVELS,...PARTY,"okNok"].forEach(k=>modSel.append(el("option",{value:k},MODULES[k]?.name || PARTY_NAMES[k] || k)));
  const title = el("input",{type:"text",placeholder:"Başlık",maxlength:"80"});
  const prompt = el("textarea",{placeholder:"Soru veya görev",maxlength:"280"});
  const tags = el("input",{type:"text",placeholder:"etiketler, virgülle",maxlength:"80"});
  const cat = el("input",{type:"text",placeholder:"kategori",maxlength:"32"});
  const hard = el("select");
  [1,2,3,4,5].forEach(n=>hard.append(el("option",{value:String(n)},"seviye "+n)));
  cbox.append(el("label",null,"Modül"),modSel);
  cbox.append(el("label",null,"Başlık"),title);
  cbox.append(el("label",null,"Soru / Görev"),prompt);
  cbox.append(el("label",null,"Etiketler"),tags);
  cbox.append(el("label",null,"Kategori"),cat);
  cbox.append(el("label",null,"Sertlik"),hard);
  cbox.append(el("div",{style:"margin-top:12px"},btn("Kartı ekle","primary",()=>{
    const t=(title.value||"").trim(); const pr=(prompt.value||"").trim();
    if(!t||!pr){toast("Başlık ve soru şart.");return}
    const card = {
      title:t.slice(0,80), prompt:pr.slice(0,280),
      tags:(tags.value||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,6),
      category:(cat.value||"özel").slice(0,32),
      hardness:parseInt(hard.value)||2, source:"custom"
    };
    const added = addCards(modSel.value,[card]);
    toast(added?"Eklendi.":"Bu kart zaten var.");
    title.value=prompt.value=tags.value=cat.value="";
  })));

  // custom cards list
  const listBox = el("div",{class:"card"});
  app.append(listBox);
  listBox.append(el("h3",null,"Özel Kartlarım"));
  function refreshList(){
    listBox.innerHTML="";
    listBox.append(el("h3",null,"Özel Kartlarım"));
    let any=false;
    [...LEVELS,...PARTY,"okNok"].forEach(m=>{
      const pool = loadPool(m).filter(c=>c.source==="custom");
      if(!pool.length)return;
      any=true;
      listBox.append(el("h4",{style:"margin-top:10px;color:var(--gold)"},MODULES[m]?.name||PARTY_NAMES[m]||m));
      pool.forEach(c=>{
        const row = el("div",{class:"kv"},
          el("div",null,c.title),
          el("button",{class:"btn small danger",onclick:()=>{
            const arr = loadPool(m).filter(x=>x.id!==c.id);
            savePool(m,arr); refreshList();
          }},"Sil"));
        listBox.append(row);
      });
    });
    if(!any) listBox.append(el("div",{class:"muted",style:"margin-top:8px"},"Henüz özel kart eklemedin."));
  }
  refreshList();

  // disabled cards
  const dbox = el("div",{class:"card"});
  app.append(dbox);
  dbox.append(el("h3",null,"Kalıcı kaldırılanlar"));
  function refreshDisabled(){
    dbox.innerHTML="";
    dbox.append(el("h3",null,"Kalıcı kaldırılanlar"));
    const d = getDisabled();
    let any=false;
    Object.keys(d).forEach(m=>{
      const ids = Object.keys(d[m]||{}).filter(id=>d[m][id]);
      if(!ids.length)return;
      any=true;
      dbox.append(el("h4",{style:"margin-top:8px;color:var(--gold)"},MODULES[m]?.name||PARTY_NAMES[m]||m));
      ids.forEach(id=>{
        const pool = loadPool(m);
        const c = pool.find(x=>x.id===id);
        dbox.append(el("div",{class:"kv"},
          el("div",null,c?c.title:id),
          el("button",{class:"btn small ghost",onclick:()=>{enableCard(m,id);refreshDisabled()}},"Geri aç")));
      });
    });
    // dice disabled
    const dd = getDiceDisabled();
    Object.keys(dd).forEach(pool=>{
      const vals = Object.keys(dd[pool]||{}).filter(v=>dd[pool][v]);
      if(!vals.length)return;
      any=true;
      dbox.append(el("h4",{style:"margin-top:8px;color:var(--gold)"},"Zar: "+pool));
      vals.forEach(v=>{
        dbox.append(el("div",{class:"kv"},
          el("div",null,v),
          el("button",{class:"btn small ghost",onclick:()=>{
            const d2=getDiceDisabled();delete d2[pool][v];setDiceDisabled(d2);refreshDisabled();
          }},"Geri aç")));
      });
    });
    if(!any) dbox.append(el("div",{class:"muted",style:"margin-top:8px"},"Kaldırılan öğe yok."));
  }
  refreshDisabled();

  // position images shortcut
  const pibox = el("div",{class:"card"});
  app.append(pibox);
  pibox.append(el("h3",null,"Pozisyon Görselleri"));
  pibox.append(el("div",{class:"muted",style:"margin-top:6px"},"Her pozisyon için kendi görselini yükle. Tarayıcında saklanır, kimseyle paylaşılmaz."));
  pibox.append(el("div",{style:"margin-top:10px"},btn("Görselleri yönet","primary",()=>navigate("#/pos-images"))));

  // export / import
  const ebox = el("div",{class:"card"});
  app.append(ebox);
  ebox.append(el("h3",null,"Veri Yedekleme"));
  ebox.append(el("div",{class:"row",style:"margin-top:10px"},
    btn("Dışa aktar","primary",exportData),
    btn("İçe aktar","gold",importData)
  ));
  ebox.append(el("div",{class:"row",style:"margin-top:10px"},
    btn("Tüm verileri sıfırla","danger",()=>{
      openModal((m,c)=>{
        m.append(el("h3",null,"Emin misin?"));
        m.append(el("div",{class:"muted",style:"margin-top:8px"},"Bu, tüm kartları, oturumları ve ayarları siler."));
        m.append(el("div",{style:"margin-top:12px"},btn("Evet, sıfırla","danger",()=>{
          openModal((m2,c2)=>{
            m2.append(el("h3",null,"Son onay"));
            m2.append(el("div",{class:"muted",style:"margin-top:8px"},"Bu işlem geri alınamaz."));
            m2.append(el("div",{style:"margin-top:12px"},btn("Sıfırla","danger",()=>{storage.reset();c();c2();navigate("#/home");location.reload()})));
            m2.append(el("div",{style:"margin-top:8px"},btn("Vazgeç","ghost",c2)));
          });
        })));
        m.append(el("div",{style:"margin-top:8px"},btn("Vazgeç","ghost",c)));
      });
    })
  ));
});

route("/pos-images",(app)=>{
  app.append(topbar("Pozisyon Görselleri"));
  const info = el("div",{class:"card"});
  info.append(el("h3",null,"Kendi görsellerini ekle"));
  info.append(el("div",{class:"muted",style:"margin-top:6px"},
    "Aşağıdaki listedeki her pozisyon için bir resim seç. Görseller sıkıştırılıp (max 800px, JPEG) sadece bu tarayıcıda saklanır. Zar attığında ilgili pozisyona düşerse görsel otomatik gösterilir."
  ));
  const search = el("input",{type:"text",placeholder:"Ara: pozisyon adı..."});
  info.append(el("div",{style:"margin-top:10px"},search));
  const filterRow = el("div",{class:"pill-row",style:"margin-top:8px"});
  let filter = "all";
  const mkFilter=(id,label)=>{
    const b = el("button",{class:"pill"+(filter===id?" active":""),onclick:()=>{
      filter=id; filterRow.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); refresh();
    }},label);
    filterRow.append(b);
  };
  mkFilter("all","Tümü");
  mkFilter("missing","Görseli olmayan");
  mkFilter("mine","Benim yüklediğim");
  info.append(filterRow);
  app.append(info);

  const listBox = el("div",{class:"card"});
  app.append(listBox);

  search.addEventListener("input",()=>refresh());

  function refresh(){
    listBox.innerHTML="";
    const q = (search.value||"").toLowerCase().trim();
    const user = getUserImages();
    const positions = (DICE.pozisyon||[]);
    let shown = 0;
    positions.forEach(text=>{
      const key = positionKey(text);
      const name = text.split(" — ")[0];
      const hasUser = !!user[key];
      const hasBuiltin = (()=>{ const low=text.toLowerCase(); for(const k in POSITION_IMAGES){ if(low.startsWith(k)) return true; } return false; })();
      if(q && !name.toLowerCase().includes(q)) return;
      if(filter==="missing" && (hasUser||hasBuiltin)) return;
      if(filter==="mine" && !hasUser) return;
      shown++;
      const row = el("div",{class:"card",style:"margin-top:10px;padding:12px"});
      const head = el("div",{class:"kv"},
        el("div",null, el("div",{style:"font-weight:600"},name),
          el("div",{class:"muted",style:"font-size:12px;margin-top:2px"},
            hasUser?"✓ Kendi görselin":(hasBuiltin?"Yerleşik illüstrasyon":"Görsel yok"))),
        el("div",null)
      );
      row.append(head);
      const preview = el("div",{style:"margin-top:8px"});
      const cur = hasUser ? user[key] : (hasBuiltin ? positionImage(text) : null);
      if(cur){
        const img = document.createElement("img");
        img.src = cur; img.alt = name;
        img.style.cssText = "max-width:220px;max-height:160px;border-radius:8px;display:block";
        preview.append(img);
      }
      row.append(preview);
      const fileInp = el("input",{type:"file",accept:"image/*",style:"display:none"});
      fileInp.addEventListener("change", async ()=>{
        const f = fileInp.files && fileInp.files[0]; if(!f) return;
        try{
          const dataUrl = await compressImageFile(f);
          const u = getUserImages(); u[key] = dataUrl;
          if(setUserImages(u)){ toast("Yüklendi."); refresh(); }
        }catch(e){ toast("Resim okunamadı."); }
      });
      const actions = el("div",{class:"row",style:"margin-top:10px;gap:8px;flex-wrap:wrap"});
      actions.append(fileInp);
      actions.append(btn(hasUser?"Değiştir":"Görsel yükle","primary",()=>fileInp.click()));
      if(hasUser){
        actions.append(btn("Kaldır","danger",()=>{
          const u = getUserImages(); delete u[key]; setUserImages(u); refresh();
        }));
      }
      row.append(actions);
      listBox.append(row);
    });
    if(!shown) listBox.append(el("div",{class:"muted",style:"padding:12px"},"Eşleşen pozisyon yok."));
    else listBox.prepend(el("div",{class:"muted",style:"padding:0 0 8px"},shown+" pozisyon"));
  }
  refresh();
});



/* ============================================================
 * 20. Export / Import
 * ============================================================ */
function exportData(){
  const data = storage.getAll();
  const blob = new Blob([JSON.stringify({
    app:"bizim-oyun", version:SCHEMA_VERSION,
    exportedAt:nowIso(), data
  },null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bizim-oyun-yedek-"+today()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(){
  const input = document.createElement("input");
  input.type="file"; input.accept="application/json";
  input.onchange = async ()=>{
    const f = input.files && input.files[0]; if(!f) return;
    if(f.size > 2*1024*1024){toast("Dosya çok büyük.");return}
    try{
      const text = await f.text();
      const obj = JSON.parse(text);
      if(obj.app!=="bizim-oyun") throw new Error("Yanlış dosya.");
      if(obj.version!==SCHEMA_VERSION) throw new Error("Sürüm uyumsuz.");
      const keys = Object.keys(obj.data||{}).filter(k=>k.startsWith("bizimOyun."));
      openModal((box,close)=>{
        box.append(el("h3",null,"İçe aktar"));
        box.append(el("div",{class:"muted",style:"margin-top:8px"},keys.length+" anahtar bulundu. Nasıl yükleyelim?"));
        box.append(el("div",{style:"margin-top:12px"},btn("Birleştir","primary",()=>{doImport(obj.data,"merge");close()})));
        box.append(el("div",{style:"margin-top:8px"},btn("Tamamen değiştir","danger",()=>{doImport(obj.data,"replace");close()})));
        box.append(el("div",{style:"margin-top:8px"},btn("Vazgeç","ghost",close)));
      });
    }catch(e){toast("Geçersiz dosya: "+e.message)}
  };
  input.click();
}
function doImport(data,mode){
  if(mode==="replace"){storage.reset()}
  for(const k in data){
    if(!k.startsWith("bizimOyun."))continue;
    if(mode==="merge" && k.startsWith("bizimOyun.pool.")){
      const existing = storage.get(k,[]);
      const seen = new Set(existing.map(c=>c.id));
      const merged = existing.slice();
      (data[k]||[]).forEach(c=>{
        if(!c || !c.title || !c.prompt)return;
        const id = c.id || cardId(c.title,c.prompt);
        if(seen.has(id))return;
        merged.push({...c,id});
        seen.add(id);
      });
      storage.set(k,merged);
    } else {
      storage.set(k,data[k]);
    }
  }
  toast("İçe aktarıldı."); render();
}

/* ============================================================
 * 21. Boot
 * ============================================================ */
if(!runMigrations()){
  document.getElementById("app").append(el("div",{class:"card"},
    el("h3",null,"Veri okunamadı"),
    el("div",{class:"muted",style:"margin-top:8px"},"Bir yedek almak ister misin?"),
    el("div",{style:"margin-top:12px"},btn("Yedek al","primary",exportData))
  ));
} else {
  // Apply saved theme + reduced motion
  const _s = getSettings();
  if(_s.theme && _s.theme!=="bordo") document.documentElement.setAttribute("data-theme", _s.theme);
  document.documentElement.style.setProperty("--rm", _s.reducedMotion?"1":"0");
  // Init all pools with core
  Object.keys(CORE).forEach(m=>loadPool(m));
  loadGuessMePool();
  // Ensure a session exists
  if(!storage.get(K.activeSession,null)) startSession();
  render();
}

// resume param from landing
if(new URLSearchParams((location.hash.split("?")[1])||"").get("resume")==="1"){
  // no-op; session persists in localStorage
}
